# Publica o site no GitHub Pages gerando SIGAV/supabase-config.js a partir dos Secrets.
# Requer: Settings → Pages → Source = "GitHub Actions" e os Secrets
# SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY (chave publishable/anon; NUNCA a service_role).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar configuração do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/generate-config.mjs

      - name: Remover arquivos que não vão para o site
        run: rm -rf .git .github supabase scripts .env.example package.json package-lock.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
