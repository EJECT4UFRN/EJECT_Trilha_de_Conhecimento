<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Perdido no Espaço | EJECT Trilha de Conhecimento</title>
    <!-- Favicon (Mantenha o seu original, se preferir) -->
    <link rel="icon" type="image/x-icon" href="/EJECT_Trilha_de_Conhecimento/img/svgs/logo-eject.svg">

    <!-- Tailwind CSS (Para estilização moderna e responsividade) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at center, #0f172a 0%, #020617 70%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            cursor: crosshair;
        }

        /* Estilos para o VLibras - Mantendo a posição original, se necessário */
        .vw-plugin-wrapper {
            position: fixed;
            top: 20px; /* Ajuste conforme a necessidade */
            right: 20px; /* Ajuste conforme a necessidade */
            z-index: 1000;
        }

        /* Animações Keyframes */
        @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseFloat {
            0% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-8px) scale(1.03); /* Mais flutuação */
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Animação das Estrelas (twinkle) */
        @keyframes twinkle {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Fundo de Estrelas Melhorado */
        #stars, #stars2, #stars3 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            animation: move-twinkle 200s linear infinite; /* Movimento mais suave */
            z-index: 1;
        }

        #stars {
            background-image: radial-gradient(1.5px 1.5px at 20% 30%, #fff, rgba(255,255,255,0)),
                              radial-gradient(1.5px 1.5px at 40% 70%, #e0e7ff, rgba(224,231,255,0)),
                              radial-gradient(1px 1px at 90% 40%, #a3b8ee, rgba(163,184,238,0)),
                              radial-gradient(1px 1px at 10% 50%, #ddd, rgba(221,221,221,0));
            background-size: 250px 250px;
            animation: move-twinkle 200s linear infinite, twinkle-stars 4s ease-in-out infinite;
        }

        #stars2 {
            background-image: radial-gradient(2px 2px at 50% 100%, #6a5acd, rgba(106,90,205,0)),
                              radial-gradient(1px 1px at 90% 40%, #fff, rgba(255,255,255,0)),
                              radial-gradient(1.5px 1.5px at 110% 80%, #a3b8ee, rgba(163,184,238,0));
            background-size: 350px 350px;
            animation: move-twinkle 180s linear infinite, twinkle-stars 3s ease-in-out infinite;
            animation-delay: -30s, -1s;
        }

        #stars3 {
            background-image: radial-gradient(1px 1px at 100% 150%, #e0e7ff, rgba(224,231,255,0)),
                              radial-gradient(2px 2px at 140% 10%, #fff, rgba(255,255,255,0)),
                              radial-gradient(1px 1px at 160% 120%, #6a5acd, rgba(106,90,205,0));
            background-size: 450px 450px;
            animation: move-twinkle 220s linear infinite, twinkle-stars 5s ease-in-out infinite;
            animation-delay: -60s, -2s;
        }

        @keyframes move-twinkle {
            from {
                background-position: 0 0;
            }
            to {
                background-position: -100% -100%;
            }
        }

        @keyframes twinkle-stars {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        /* Animações melhoradas para os planetas flutuantes */
        @keyframes float-fade {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.7) rotate(0deg);
            }
            15% {
                opacity: 0.8;
                transform: translate(15px, -8px) scale(1) rotate(10deg);
            }
            50% {
                opacity: 0.9;
                transform: translate(-5px, 15px) scale(1.1) rotate(-5deg);
            }
            85% {
                opacity: 0.8;
                transform: translate(-15px, 8px) scale(1.05) rotate(15deg);
            }
            100% {
                opacity: 0;
                transform: translate(0, 0) scale(0.7) rotate(0deg);
            }
        }

        @keyframes orbit-slow {
            0% {
                transform: rotate(0deg) translateX(50px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(50px) rotate(-360deg);
            }
        }

        /* Meteoros com visual realista e bonito */
        .meteor {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #fff 0%, #6a5acd 50%, transparent 70%);
            border-radius: 50%;
            z-index: 2;
            animation: meteor-fall linear infinite;
        }

        .meteor::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 80px;
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.9) 0%,
                rgba(106, 90, 205, 0.7) 20%,
                rgba(106, 90, 205, 0.4) 50%,
                rgba(106, 90, 205, 0.1) 80%,
                transparent 100%);
            transform-origin: top center;
            border-radius: 2px;
            filter: blur(1px);
        }

        .meteor::after {
            content: '';
            position: absolute;
            top: 0;
            left: -1px;
            width: 6px;
            height: 40px;
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.6) 0%,
                rgba(224, 231, 255, 0.4) 30%,
                rgba(106, 90, 205, 0.2) 60%,
                transparent 100%);
            border-radius: 3px;
            filter: blur(0.5px);
        }

        @keyframes meteor-fall {
            0% {
                top: -10%;
                left: -5%;
                opacity: 0;
                transform: rotate(135deg) scale(0.5);
            }
            5% {
                opacity: 1;
                transform: rotate(135deg) scale(1);
            }
            95% {
                opacity: 1;
                transform: rotate(135deg) scale(1);
            }
            100% {
                top: 110%;
                left: 105%;
                opacity: 0;
                transform: rotate(135deg) scale(0.8);
            }
        }

        .meteor:nth-child(6) { 
            animation-duration: 3s; 
            animation-delay: 0s;
        }
        .meteor:nth-child(7) { 
            animation-duration: 4.5s; 
            animation-delay: 1.5s;
        }
        .meteor:nth-child(8) { 
            animation-duration: 3.8s; 
            animation-delay: 3s;
        }
        .meteor:nth-child(9) { 
            animation-duration: 5s; 
            animation-delay: 4.5s;
        }

        /* Poeira cósmica */
        .cosmic-dust {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 85% 75%, rgba(106,90,205,0.2), transparent),
                radial-gradient(1px 1px at 45% 55%, rgba(224,231,255,0.4), transparent);
            background-size: 200px 200px, 300px 300px, 150px 150px;
            z-index: 1;
            animation: drift-cosmic 120s linear infinite;
            opacity: 0.6;
        }

        @keyframes drift-cosmic {
            0% {
                background-position: 0 0, 50px 50px, 100px 0;
            }
            100% {
                background-position: 200px 200px, 250px 250px, 300px 150px;
            }
        }

        /* Efeitos de hover suaves apenas no botão */
        .error-container:hover {
            transform: translateY(-2px);
            transition: transform 0.3s ease;
        }

        /* Estilo para o contêiner principal da página de erro */
        .error-container {
            background-color: rgba(30, 42, 71, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e7ff;
            border-radius: 1.5rem;
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.4), 
                        0 8px 10px -3px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            max-width: 90vw;
            width: 100%;
            margin: 1rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            animation: fadeInSlideUp 0.8s ease-out forwards;
            position: relative;
            z-index: 10;
        }

        /* Melhor responsividade para tablets */
        @media (min-width: 640px) {
            .error-container {
                padding: 2.5rem;
                max-width: 85vw;
                gap: 2.5rem;
            }
        }

        /* Layout para telas médias e grandes */
        @media (min-width: 768px) {
            .error-container {
                flex-direction: row;
                text-align: left;
                padding: 3rem;
                max-width: 950px;
                gap: 3rem;
            }
        }

        /* Otimizações para telas muito pequenas */
        @media (max-width: 480px) {
            .error-container {
                padding: 1.5rem;
                margin: 0.5rem;
                gap: 1.5rem;
            }
        }

        .error-visual {
            position: relative;
            flex-shrink: 0;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .error-visual {
                max-width: 280px;
            }
        }

        @media (min-width: 768px) {
            .error-visual {
                max-width: 400px;
            }
        }

        .error-visual .error-code {
            width: 100%;
            max-width: 450px;
            height: auto;
            /* Animação do SVG 404 */
            animation: fadeIn 1.2s ease-out forwards, pulseGlow 3s ease-in-out infinite;
            animation-delay: 0.3s, 1.5s;
            opacity: 0;
            filter: drop-shadow(0 0 20px rgba(106, 90, 205, 0.6));
        }

        @keyframes pulseGlow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(106, 90, 205, 0.6));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 30px rgba(106, 90, 205, 0.9));
                transform: scale(1.02);
            }
        }
        
        /* Animação melhorada para o astronauta vagante */
        @keyframes wander-full-screen {
            0% { 
                top: 15%; 
                left: 10%; 
                transform: translate(-50%, -50%) rotate(0deg) scale(1);
            }
            20% { 
                top: 70%; 
                left: 80%; 
                transform: translate(-50%, -50%) rotate(15deg) scale(1.1);
            }
            40% { 
                top: 25%; 
                left: 85%; 
                transform: translate(-50%, -50%) rotate(-10deg) scale(0.9);
            }
            60% { 
                top: 85%; 
                left: 25%; 
                transform: translate(-50%, -50%) rotate(20deg) scale(1.05);
            }
            80% { 
                top: 30%; 
                left: 15%; 
                transform: translate(-50%, -50%) rotate(-5deg) scale(0.95);
            }
            100% { 
                top: 15%; 
                left: 10%; 
                transform: translate(-50%, -50%) rotate(0deg) scale(1);
            }
        }

        .astronaut-floating {
            position: fixed;
            width: 120px; /* Tamanho otimizado */
            height: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: wander-full-screen 50s ease-in-out infinite, 
                       fadeIn 2s ease-out forwards,
                       float-gentle 6s ease-in-out infinite;
            animation-delay: 2s, 1s, 3s;
            z-index: 5;
            opacity: 0;
            filter: drop-shadow(0 0 15px rgba(106, 90, 205, 0.3));
        }

        @keyframes float-gentle {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(106, 90, 205, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(106, 90, 205, 0.6));
            }
        }

        /* Não é necessário media query para o astronauta aqui, pois wander-full-screen usa porcentagens */


        .error-content {
            flex-grow: 1; /* Permite que o conteúdo cresça */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (min-width: 768px) {
            .error-content {
                align-items: flex-start; /* Alinha o texto à esquerda em telas maiores */
            }
        }

        .error-content .main-message {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e0e7ff;
            margin-bottom: 0.8rem;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 0.8s;
            opacity: 0;
        }

        .error-content .sub-message {
            font-size: 1rem;
            color: #a3b8ee;
            line-height: 1.6;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 1s;
            opacity: 0;
        }

        /* Responsividade para telas pequenas */
        @media (max-width: 480px) {
            .error-content .main-message {
                font-size: 1.5rem;
                margin-bottom: 0.6rem;
            }
            
            .error-content .sub-message {
                font-size: 0.9rem;
                margin-bottom: 1.5rem;
            }
        }

        /* Responsividade para telas médias */
        @media (min-width: 640px) {
            .error-content .main-message {
                font-size: 2rem;
            }
            
            .error-content .sub-message {
                font-size: 1.1rem;
            }
        }

        /* Responsividade para telas grandes */
        @media (min-width: 768px) {
            .error-content .main-message {
                font-size: 2.2rem;
            }
            
            .error-content .sub-message {
                font-size: 1.125rem;
            }
        }

        .btn-primary-custom {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #6a5acd 0%, #5747a8 100%);
            border: none;
            border-radius: 0.75rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px -2px rgba(106, 90, 205, 0.3), 
                        0 3px 8px -1px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 1.2s;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }

        .btn-primary-custom::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary-custom:hover::before {
            left: 100%;
        }

        /* Responsividade do botão */
        @media (max-width: 480px) {
            .btn-primary-custom {
                padding: 0.7rem 1.5rem;
                font-size: 0.9rem;
            }
        }

        @media (min-width: 768px) {
            .btn-primary-custom {
                padding: 0.9rem 2rem;
                font-size: 1.1rem;
            }
        }

        .btn-primary-custom:hover {
            background-color: #5747a8; /* Escurece no hover */
            transform: translateY(-3px); /* Efeito de "levantar" mais pronunciado */
            color: #ffffff;
            box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.3), 0 5px 8px -2px rgba(0, 0, 0, 0.15); /* Sombra mais intensa no hover */
        }

        .btn-primary-custom:active {
            transform: translateY(0); /* Retorna à posição normal no clique */
            box-shadow: 0 6px 10px -2px rgba(0, 0, 0, 0.2), 0 3px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Estilo aprimorado para os planetas flutuantes */
        .planet {
            position: absolute;
            border-radius: 50%;
            filter: blur(0.5px);
            z-index: 1;
            opacity: 0;
            animation: float-fade linear infinite;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6),
                        0 0 25px rgba(106, 90, 205, 0.3);
            transition: all 0.3s ease;
        }

        .planet:hover {
            transform: scale(1.1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6),
                        0 0 35px rgba(106, 90, 205, 0.6);
        }

        /* Variações de planetas para randomização */
        .planet-1 {
            width: 100px;
            height: 100px;
            /* Gradiente para um planeta rochoso com crateras */
            background: radial-gradient(circle at 70% 30%, #a0522d 0%, #8b4513 50%, #5c2f0a 100%);
            top: 15%;
            left: 5%;
            animation-duration: 20s;
            animation-delay: 0s;
        }

        .planet-2 {
            width: 150px;
            height: 150px;
            /* Gradiente para um gigante gasoso azul */
            background: radial-gradient(circle at 30% 70%, #6a5acd 0%, #4c51bf 50%, #2a3377 100%);
            bottom: 10%;
            right: 15%;
            animation-duration: 25s;
            animation-delay: 5s;
        }

        .planet-3 {
            width: 80px;
            height: 80px;
            /* Gradiente para um planeta com atmosfera esverdeada */
            background: radial-gradient(circle at 40% 60%, #bada55 0%, #8bc34a 50%, #558b2f 100%);
            top: 50%;
            right: 5%;
            animation-duration: 18s;
            animation-delay: 10s;
        }

        .planet-4 {
            width: 120px;
            height: 120px;
            /* Gradiente para um planeta avermelhado/desértico */
            background: radial-gradient(circle at 60% 40%, #e85d04 0%, #d83a00 50%, #a32a00 100%);
            bottom: 25%;
            left: 20%;
            animation-duration: 22s;
            animation-delay: 15s;
        }

        .planet-5 {
            width: 70px;
            height: 70px;
            /* Gradiente para um planeta gelado */
            background: radial-gradient(circle at 50% 50%, #e0f2f7 0%, #a7d9ed 50%, #60a8c9 100%);
            top: 5%;
            right: 25%;
            animation-duration: 19s;
            animation-delay: 8s;
        }
    </style>
</head>
