<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Dashboard</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../img/svgs/logo-eject.svg">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(275.04deg, rgb(228, 243, 255) 1.05%, rgb(244, 246, 251) 100%);
        }

        .progress-fill {
            transition: width 1s ease-in-out;
        }

        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }

        .dashboard-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.2);
        }
    </style>
</head>

<body class="antialiased text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-4">
                    <img src="../img/logo.svg" alt="EJECT" class="h-8">
                    <span class="text-xl font-bold text-sky-900 border-l border-gray-200 pl-4">
                        HUB DO MEMBRO
                    </span>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="hidden md:flex items-center gap-2 mr-4">
                        <div class="text-right">
                            <p id="userNameDisplay" class="text-sm font-bold text-gray-700">Carregando...</p>
                            <p class="text-xs text-gray-500">Membro EJECT</p>
                        </div>
                        <a href="perfil.html"
                            class="h-10 w-10 rounded-full bg-sky-100 flex items-center justify-center text-sky-600 hover:ring-2 ring-sky-300 transition-all">
                            <i data-lucide="user" class="h-5 w-5"></i>
                        </a>
                    </div>
                    <button id="logoutBtn" class="text-gray-500 hover:text-red-600 transition-colors" title="Sair">
                        <i data-lucide="log-out" class="h-5 w-5"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">

        <div>
            <h1 id="welcomeMessage" class="text-3xl font-extrabold text-sky-900">Olá!</h1>
            <p class="text-gray-600 mt-1">Visão geral do seu desenvolvimento.</p>
        </div>

        <div id="heroTrackContainer" class="space-y-8">
            <div class="bg-white rounded-2xl shadow-lg border border-sky-100 p-8 text-center animate-pulse">
                <div class="h-8 bg-gray-200 rounded w-1/3 mx-auto mb-4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto"></div>
            </div>
        </div>

        <section>
            <h2 class="text-2xl font-bold text-sky-800 mb-6 flex items-center gap-2">
                <i data-lucide="layers" class="h-6 w-6 text-sky-600"></i>
                Trilhas Complementares
            </h2>

            <div id="parallelTrailsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

            <div id="noTrailsMessage"
                class="hidden text-center py-12 bg-white rounded-xl shadow-md border border-gray-100">
                <i data-lucide="book-open" class="h-12 w-12 mx-auto text-sky-300"></i>
                <h2 class="mt-4 text-xl font-bold text-gray-600">Nenhuma trilha complementar iniciada</h2>
                <p class="text-gray-400 mt-2 text-sm">Explore o catálogo para começar novos aprendizados.</p>
            </div>
        </section>

    </main>

    <script src="./firebase-config.js"></script>

    <script>
        lucide.createIcons();
        const auth = firebase.auth();
        const db = firebase.database();

        // --- CONFIGURAÇÃO: DEFINIÇÃO DAS TRILHAS ESPECIAIS (HERO) ---
        const SPECIALIZATIONS = {
            'uxui': {
                title: 'O Astronauta vai à Lua (UX/UI)',
                subtitle: 'Especialização em Design de Interfaces.',
                colorHex: '#BD00FF',
                colorTailwind: 'purple',
                icon: 'rocket',
                link: '../nivelamento/uxui/trilha_uxui.html'
            },
            'frontend': {
                title: 'O Astronauta vai à Lua (Frontend)',
                subtitle: 'Especialização em Desenvolvimento Web.',
                colorHex: '#3B82F6',
                colorTailwind: 'blue',
                icon: 'code',
                link: '../nivelamento/front/trilha_front.html'
            },
            'backend': {
                title: 'O Astronauta vai à Lua (Backend)',
                subtitle: 'Especialização em Arquitetura e Dados.',
                colorHex: '#10B981',
                colorTailwind: 'green',
                icon: 'server',
                link: '../nivelamento/back/trilha_back.html'
            }
        };

        // --- LISTA DE TRILHAS PADRÃO (PARALELAS) ---
        const ALL_TRAILS = [
            { id: 'html_e_css', title: 'HTML 5 e CSS 3', description: 'Fundamentos web.', link: '../Trilhas/html_e_css.html', totalTopics: 12 },
            { id: 'javaScript', title: 'JavaScript Essencial', description: 'Lógica e DOM.', link: '../Trilhas/javaScript.html', totalTopics: 5 },
            { id: 'marketing_comercial', title: 'Marketing e Comercial', description: 'Estratégias de venda.', link: '../Trilhas/marketing_comercial.html', totalTopics: 11 },
            { id: 'git_e_github', title: 'Git e GitHub', description: 'Versionamento de código.', link: '../Trilhas/git_e_github.html', totalTopics: 8 },
        ];


        // 1. CONTROLADOR PRINCIPAL
        async function showDashboard(user) {
            try {
                const userRef = db.ref(`users/${user.uid}`);
                const userSnapshot = await userRef.once('value');
                const userData = userSnapshot.val() || {};
                const userName = userData.name || user.displayName || user.email.split('@')[0];
                document.getElementById('userNameDisplay').textContent = userName;
                document.getElementById('welcomeMessage').textContent = `Olá, ${userName.split(' ')[0]}!`;

                loadDashboardData(user.uid);

            } catch (error) {
                console.error("Erro no dashboard:", error);
            }
        }

        // 2. LÓGICA DE DADOS DO DASHBOARD
        async function loadDashboardData(uid) {
            const progressRef = db.ref(`users/${uid}/progress`);
            const snapshot = await progressRef.once('value');
            const allProgress = snapshot.val() || {};

            const heroContainer = document.getElementById('heroTrackContainer');
            const gridContainer = document.getElementById('parallelTrailsGrid');
            const noTrailsMsg = document.getElementById('noTrailsMessage');

            heroContainer.innerHTML = '';
            gridContainer.innerHTML = '';

            const userTrailIds = Object.keys(allProgress);

            // A. FILTRA E RENDERIZA TODAS AS ESPECIALIZAÇÕES (HERO)
            const activeSpecializations = userTrailIds.filter(id => SPECIALIZATIONS[id]);

            if (activeSpecializations.length > 0) {
                activeSpecializations.forEach(specId => {
                    const heroHTML = getHeroCardHTML(specId, allProgress[specId]);
                    heroContainer.innerHTML += heroHTML;
                });
            } else {
                heroContainer.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-lg border border-sky-100 p-8 text-center">
                        <div class="bg-sky-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="compass" class="h-8 w-8 text-sky-600"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">Comece sua Jornada</h2>
                        <p class="text-gray-500 mb-6 max-w-md mx-auto">Escolha uma trilha de especialização (Astronauta) ou um curso rápido para ver seu progresso aqui.</p>
                    </div>
                `;
            }

            // B. RENDERIZA APENAS TRILHAS QUE NÃO SÃO ESPECIALIZAÇÕES
            let parallelCount = 0;
            userTrailIds.forEach(trailId => {
                if (SPECIALIZATIONS[trailId]) return;

                const trailInfo = ALL_TRAILS.find(t => t.id === trailId);

                if (trailInfo) {
                    const { percentage } = calculateGenericProgress(allProgress[trailId], trailInfo.totalTopics);
                    const card = createParallelCard(trailInfo, percentage);
                    gridContainer.insertAdjacentHTML('beforeend', card);
                    parallelCount++;
                }
            });

            if (parallelCount === 0) noTrailsMsg.classList.remove('hidden');
            else noTrailsMsg.classList.add('hidden');

            lucide.createIcons();
        }

        // ============================================================
        // GERADOR DE HTML DO HERO (ATUALIZADO COM NÍVEL 3)
        // ============================================================
        function getHeroCardHTML(specId, progressData) {
            const spec = SPECIALIZATIONS[specId];

            // 1. Cálculo Nível 1
            let lvl1Pct = 0;
            if (progressData.level1 && progressData.level1.tasks) {
                const tasks = progressData.level1.tasks;
                const done = Object.values(tasks).filter(v => v === true).length;
                lvl1Pct = Math.round((done / 3) * 100);
                if (lvl1Pct > 100) lvl1Pct = 100;
            }

            // 2. Cálculo Nível 2
            let lvl2Unlocked = progressData.level2_unlocked === true;
            let lvl2Pct = 0;
            if (progressData.level2 && progressData.level2.tasks) {
                const tasks2 = progressData.level2.tasks;
                const done2 = Object.values(tasks2).filter(v => v === true).length;
                lvl2Pct = Math.round((done2 / 3) * 100);
                if (lvl2Pct > 100) lvl2Pct = 100;
            }

            // 3. Cálculo Nível 3 (NOVA LÓGICA)
            let lvl3Unlocked = progressData.level3_unlocked === true;
            let lvl3Pct = 0;
            if (progressData.level3 && progressData.level3.tasks) {
                const tasks3 = progressData.level3.tasks;
                const done3 = Object.values(tasks3).filter(v => v === true).length;
                lvl3Pct = Math.round((done3 / 3) * 100); // Assumindo 3 tarefas para o avançado também
                if (lvl3Pct > 100) lvl3Pct = 100;
            }

            // HTML do Card
            return `
                <section class="bg-white rounded-2xl shadow-lg border border-sky-100 overflow-hidden relative transition-all hover:shadow-xl mb-8">
                    <div class="bg-gradient-to-r from-[#0B0E14] to-${spec.colorTailwind}-900 p-6 sm:p-8 text-white relative overflow-hidden" style="background: linear-gradient(90deg, #0B0E14 0%, ${spec.colorHex} 100%);">
                        <div class="absolute top-0 right-0 p-8 opacity-10">
                            <i data-lucide="${spec.icon}" class="w-32 h-32"></i>
                        </div>
                        <div class="relative z-10">
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs font-bold uppercase tracking-widest mb-3 text-white">
                                <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                                Especialização Ativa
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-black mb-2">${spec.title}</h2>
                            <p class="text-white/80 text-sm max-w-xl">${spec.subtitle}</p>
                            <div class="mt-6">
                                <a href="${spec.link}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-white text-${spec.colorTailwind}-600 font-bold rounded-lg transition-all shadow-lg hover:bg-gray-100" style="color: ${spec.colorHex}">
                                    Continuar Missão
                                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="p-6 grid md:grid-cols-3 gap-6 bg-white">
                        ${renderLevelCard(1, 'Básico', lvl1Pct, false, spec.colorHex)}
                        ${renderLevelCard(2, 'Intermediário', lvl2Pct, lvl2Unlocked, spec.colorHex)}
                        ${renderLevelCard(3, 'Avançado', lvl3Pct, lvl3Unlocked, spec.colorHex)}
                    </div>
                </section>
            `;
        }

        // Helper Visual
        function renderLevelCard(level, title, pct, unlocked, colorHex) {
            const isCompleted = pct === 100;
            let statusText = "Bloqueado";
            let statusClass = "text-gray-400";
            let barColor = "bg-gray-200";
            let icon = "lock";
            let iconBg = "bg-gray-100 text-gray-400";

            if (isCompleted) {
                statusText = "Concluído";
                statusClass = "text-green-600";
                barColor = "bg-green-500";
                icon = "check-circle";
                iconBg = "bg-green-100 text-green-600";
            } else if (pct > 0 || unlocked || level === 1) {
                statusText = pct > 0 ? "Em andamento" : (level === 1 ? "Disponível" : "Desbloqueado");
                statusClass = `text-[${colorHex}]`;
                barColor = `bg-[${colorHex}]`;
                icon = "play-circle";
                iconBg = `bg-gray-100 text-[${colorHex}]`;
            }

            const inlineTextStyle = (!isCompleted && (pct > 0 || unlocked || level === 1)) ? `color: ${colorHex}` : '';
            const inlineBarStyle = (!isCompleted && (pct > 0 || unlocked || level === 1)) ? `background-color: ${colorHex}` : '';

            return `
                <div class="border border-gray-100 rounded-xl p-4 hover:bg-gray-50 transition-colors">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wide">Nível 0${level}</span>
                            <h3 class="font-bold text-gray-800">${title}</h3>
                        </div>
                        <div class="h-8 w-8 rounded-full flex items-center justify-center ${iconBg}" style="${inlineTextStyle}">
                            <i data-lucide="${icon}" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <div class="flex items-end justify-between mb-1">
                        <span class="text-2xl font-black text-gray-800">${pct}%</span>
                        <span class="text-xs font-bold mb-1 uppercase tracking-wide ${statusClass}" style="${inlineTextStyle}">${statusText}</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                        <div class="h-2 rounded-full w-0 progress-fill ${barColor}" style="width: ${pct}%; ${inlineBarStyle}"></div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // HELPERS GERAIS
        // ============================================================
        function calculateGenericProgress(progressData, totalTopics) {
            if (!progressData || typeof progressData !== 'object' || totalTopics === 0) return { percentage: 0 };
            const completedCount = Object.values(progressData).filter(status => status === true).length;
            const percentage = Math.round((completedCount / totalTopics) * 100);
            return { percentage };
        }

        function createParallelCard(trail, percentage) {
            const isCompleted = percentage === 100;
            const borderColor = isCompleted ? 'border-green-500' : 'border-sky-500';
            const textColor = isCompleted ? 'text-green-700' : 'text-sky-700';
            const bgColor = isCompleted ? 'bg-green-600' : 'bg-sky-600';
            const icon = isCompleted ? 'check-circle-2' : 'arrow-right';

            return `
                <a href="${trail.link}" class="dashboard-card block bg-white rounded-xl p-6 shadow-lg card-shadow border-t-4 ${borderColor} transition transform duration-300">
                    <div class="flex items-start justify-between mb-4">
                        <h2 class="text-lg font-bold ${textColor} leading-tight flex-1 pr-2">${trail.title}</h2>
                        <i data-lucide="${icon}" class="h-6 w-6 ${textColor.replace('700', '500')} flex-shrink-0"></i>
                    </div>
                    <p class="text-gray-600 mb-4 text-sm leading-relaxed">${trail.description}</p>
                    <div class="mt-4">
                        <h3 class="text-xs font-semibold ${textColor} mb-2">Seu Progresso:</h3>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div class="h-2.5 rounded-full ${bgColor} transition-all duration-500" style="width: ${percentage}%"></div>
                        </div>
                        <p class="text-xs font-medium mt-1.5 text-gray-500 text-right">${percentage}%</p>
                    </div>
                </a>
            `;
        }

        // --- AUTH ---
        function handleLogout() {
            auth.signOut().then(() => window.location.href = 'login.html');
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                showDashboard(user);
                document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            } else {
                window.location.href = 'login.html';
            }
        });

    </script>
</body>

</html>
