<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Gerenciar Administradores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../img/svgs/logo-eject.svg">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        body { font-family: "Inter", sans-serif; background: linear-gradient(275.04deg, rgb(228, 243, 255) 1.05%, rgb(244, 246, 251) 100%); }
        /* Correção do CSS para o botão de alternância (toggle) */
        .toggle-checkbox:checked + div {
            background-color: #48bb78; /* Cor verde quando ativo */
        }
        .toggle-checkbox:checked + div + .dot {
            transform: translateX(100%);
        }
        .dot {
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <span class="text-2xl font-bold text-sky-700">Gerenciar Admins</span>
                <div class="flex items-center space-x-4">
                    <a href="./sigav_hub.html" title="Voltar ao Hub SIGAV" class="p-2 rounded-full text-sky-600 hover:bg-sky-100"><i data-lucide="home" class="h-6 w-6"></i></a>
                    <a href="https://www.ejectufrn.com.br/" target="_blank"><img src="../img/logo.svg" alt="Logotipo da EJECT" class="h-10"></a>
                </div>
            </div>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <h1 class="text-4xl font-extrabold text-sky-800 mb-8 flex items-center"><i data-lucide="users" class="h-8 w-8 mr-3"></i>Lista de Usuários</h1>
        <div id="userListContainer" class="bg-white rounded-xl shadow-lg p-6">
            <p id="loadingMessage">Carregando usuários...</p>
            <!-- Lista de usuários será inserida aqui -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
    <script src="./supabase-config.js"></script>
    <script src="./supabase-client.js"></script>
    <script src="./data-api.js"></script>
    <script>
        let currentUid = null;

        // users: [{uid, name, email}]; admins: { uid: { isSuper } }
        function renderUserList(users, admins) {
            const container = document.getElementById('userListContainer');
            container.innerHTML = '';

            if (!users || users.length === 0) {
                container.innerHTML = '<p>Nenhum usuário encontrado.</p>';
                return;
            }

            users.forEach(user => {
                const uid = user.uid;
                const isSuperAdmin = !!(admins[uid] && admins[uid].isSuper);
                const isAdmin = !!admins[uid];

                const userElement = document.createElement('div');
                userElement.className = 'flex items-center justify-between py-3 border-b last:border-b-0';
                userElement.innerHTML = `
                    <div>
                        <p class="font-semibold">${Api.esc(user.name) || 'Nome não definido'}</p>
                        <p class="text-sm text-gray-500">${Api.esc(user.email) || 'E-mail não definido'}</p>
                    </div>
                    <div class="flex items-center">
                        ${isSuperAdmin ? '<span class="text-sm font-bold text-purple-600 mr-4">Super Admin</span>' : `
                        <label for="toggle-${Api.esc(uid)}" class="flex items-center cursor-pointer">
                            <div class="relative">
                                <input type="checkbox" id="toggle-${Api.esc(uid)}" class="sr-only toggle-checkbox" ${isAdmin ? 'checked' : ''}>
                                <div class="block bg-gray-600 w-14 h-8 rounded-full"></div>
                                <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition"></div>
                            </div>
                        </label>
                        `}
                    </div>
                `;
                container.appendChild(userElement);

                if (!isSuperAdmin) {
                    document.getElementById(`toggle-${uid}`).addEventListener('change', async (e) => {
                        const newAdminStatus = e.target.checked;
                        try {
                            await Api.setAdmin(uid, newAdminStatus, currentUid);
                            console.log(`Status de admin para ${uid} atualizado para ${newAdminStatus}`);
                        } catch (err) {
                            console.error("Erro ao atualizar status de admin:", err);
                            e.target.checked = !newAdminStatus;
                        }
                    });
                }
            });
        }

        async function loadAndRender() {
            const [users, admins] = await Promise.all([Api.listProfiles(), Api.listAdmins()]);
            renderUserList(users, admins);
        }

        function initAdminManagement() {
            lucide.createIcons();
            let started = false;
            Api.onAuthChange(async user => {
                if (!user) {
                    window.location.href = './sigav_hub.html';
                    return;
                }
                if (started) return;
                started = true;
                currentUid = user.uid;

                // Qualquer admin pode acessar esta página (a segurança real está no RLS do banco).
                if (await Api.isAdmin()) {
                    try {
                        await loadAndRender();
                        // Recarrega quando a lista de admins muda (equivale ao antigo .on('value')).
                        Api.watch('admins', () => loadAndRender().catch(console.error));
                    } catch (error) {
                        console.error("Erro ao carregar dados:", error);
                        document.getElementById('loadingMessage').textContent = 'Erro ao carregar dados. Verifique as permissões.';
                    }
                } else {
                    alert('Acesso negado. Esta área é restrita para administradores.');
                    window.location.href = './sigav_hub.html';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initAdminManagement);
    </script>
</body>
</html>
