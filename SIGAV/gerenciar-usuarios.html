<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Gerenciar Usuários</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../img/svgs/logo-eject.svg">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style> body { font-family: "Inter", sans-serif; background: linear-gradient(275.04deg, rgb(228, 243, 255) 1.05%, rgb(244, 246, 251) 100%); } </style>
</head>
<body class="antialiased text-gray-800">

    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <span class="text-2xl font-bold text-sky-700">Gerenciar Usuários</span>
                <div class="flex items-center space-x-4">
                    <a href="./sigav_hub.html" title="Voltar ao Hub SIGAV" class="p-2 rounded-full text-sky-600 hover:bg-sky-100"><i data-lucide="home" class="h-6 w-6"></i></a>
                    <a href="https://www.ejectufrn.com.br/" target="_blank"><img src="../img/logo.svg" alt="Logotipo da EJECT" class="h-10"></a>
                </div>
            </div>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <h1 class="text-4xl font-extrabold text-sky-800 mb-8 flex items-center"><i data-lucide="users" class="h-8 w-8 mr-3"></i>Lista de Usuários</h1>
        <div id="userListContainer" class="bg-white rounded-xl shadow-lg p-6 space-y-4">
            <p id="loadingMessage">Carregando usuários...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
    <script src="./supabase-config.js"></script>
    <script src="./supabase-client.js"></script>
    <script src="./data-api.js"></script>
    <script>
        // users: [{uid, name, email}]
        function renderUserList(users) {
            const container = document.getElementById('userListContainer');
            container.innerHTML = '';

            if (!users || users.length === 0) {
                container.innerHTML = '<p>Nenhum usuário encontrado.</p>';
                return;
            }

            const sortedUsers = [...users].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

            sortedUsers.forEach((user) => {
                const uid = user.uid;
                const userElement = document.createElement('div');
                userElement.className = 'p-4 border rounded-lg flex flex-col sm:flex-row items-start sm:items-center justify-between';
                userElement.innerHTML = `
                    <div class="flex-grow">
                        <input type="text" value="${Api.esc(user.name)}" id="name-${Api.esc(uid)}" class="text-lg font-semibold border-b-2 border-transparent focus:border-sky-500 outline-none w-full bg-transparent" placeholder="Nome do usuário">
                        <p class="text-sm text-gray-500">${Api.esc(user.email) || 'E-mail não definido'}</p>
                    </div>
                    <div class="flex items-center space-x-2 mt-4 sm:mt-0">
                        <button id="save-${Api.esc(uid)}" class="p-2 bg-sky-100 text-sky-600 rounded-full hover:bg-sky-200" title="Salvar Nome"><i data-lucide="save" class="h-5 w-5"></i></button>
                        <button id="reset-${Api.esc(uid)}" class="p-2 bg-amber-100 text-amber-600 rounded-full hover:bg-amber-200" title="Resetar Progresso"><i data-lucide="rotate-cw" class="h-5 w-5"></i></button>
                    </div>
                `;
                container.appendChild(userElement);

                // Salvar nome
                document.getElementById(`save-${uid}`).addEventListener('click', async () => {
                    const newName = document.getElementById(`name-${uid}`).value.trim();
                    if (newName) {
                        try {
                            await Api.updateName(uid, newName);
                            alert('Nome salvo com sucesso!');
                        } catch (err) {
                            console.error(err);
                            alert('Erro ao salvar o nome.');
                        }
                    }
                });

                // Resetar progresso
                document.getElementById(`reset-${uid}`).addEventListener('click', async () => {
                    if (confirm(`Tem certeza que deseja resetar o progresso de ${user.name || user.email}?`)) {
                        try {
                            await Api.resetUserProgress(uid);
                            alert('Progresso resetado com sucesso!');
                        } catch (err) {
                            console.error(err);
                            alert('Erro ao resetar o progresso.');
                        }
                    }
                });
            });
            lucide.createIcons();
        }

        async function loadUsers() {
            renderUserList(await Api.listProfiles());
        }

        async function initUserManagementPage() {
            lucide.createIcons();
            let started = false;
            Api.onAuthChange(async user => {
                if (!user) {
                    window.location.href = './sigav_hub.html';
                    return;
                }
                if (started) return;
                started = true;

                if (await Api.isAdmin()) {
                    try {
                        await loadUsers();
                        // Mantém a lista atualizada (equivale ao antigo .on('value')).
                        Api.watch('profiles', () => loadUsers().catch(console.error));
                    } catch (error) {
                        console.error("Erro ao carregar dados:", error);
                    }
                } else {
                    alert('Acesso negado. Esta área é restrita para administradores.');
                    window.location.href = './sigav_hub.html';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initUserManagementPage);
    </script>
</body>
</html>
