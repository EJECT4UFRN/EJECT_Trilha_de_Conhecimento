<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../img/svgs/logo-eject.svg">
    <style>
        body {
            font-family: "Inter", sans-serif;
            height: 100vh;
            background: linear-gradient(275.04deg, rgb(228, 243, 255) 1.05%, rgb(244, 246, 251) 100%);
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .modal-content {
            background-color: white;
            padding: 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
            color: #1f2937;
        }
    </style>
</head>
<body class="antialiased">

    <div class="modal-content hidden">
        <img src="../img/logo.svg" alt="Logotipo da EJECT" class="h-12 mx-auto mb-6">
        <h2 class="text-3xl font-bold text-sky-700 mb-4">Acesso às Trilhas</h2>
        <p class="text-gray-600 mb-6">Use seu e-mail e senha para acessar.</p>
        
        <div class="space-y-4">
            <input 
                type="text" 
                id="nameInput" 
                placeholder="Seu nome completo" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500 hidden"
                autocomplete="name"
            >
            <input 
                type="email" 
                id="emailInput" 
                placeholder="Seu e-mail" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500"
                autocomplete="email"
            >
            <input 
                type="password" 
                id="passwordInput" 
                placeholder="Sua senha" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500"
                autocomplete="current-password"
            >
        </div>

        <div class="text-right mt-2">
            <a href="recuperar-senha.html" class="text-sm text-sky-600 hover:underline">Esqueceu a senha?</a>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mt-6">
            <button 
                id="loginBtn" 
                class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-lg shadow transition duration-150 ease-in-out"
            >
                Entrar
            </button>
            <button 
                id="registerBtn" 
                class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 rounded-lg shadow transition duration-150 ease-in-out"
            >
                Registrar
            </button>
        </div>
        <p id="loginError" class="text-red-500 text-sm mt-4 h-4"></p>
        <a href="#" id="backToLogin" class="text-sky-600 hover:underline text-sm mt-4 hidden">Voltar para o login</a>
        
        <div class="mt-6 pt-4 border-t border-gray-200">
            <p class="text-xs text-gray-500">
                Ao usar nossa plataforma, você concorda com nossos 
                <a href="../termos_de_uso.html" target="_blank" class="text-sky-600 hover:text-sky-700 underline">
                    Termos de Uso
                </a>
            </p>
        </div>
    </div>

    <!-- Firebase Config e Lógica de Autenticação -->
    <script src="firebase-config.js"></script>
    <script>
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const loginError = document.getElementById('loginError');
        const backToLogin = document.getElementById('backToLogin');

        let isRegisterMode = false;

        // --- Funções de Autenticação ---

        function handleLogin() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            loginError.textContent = ''; // Limpa erros

            if (!email || !password) {
                loginError.textContent = 'Por favor, preencha e-mail e senha.';
                return;
            }

            // Desabilita o botão durante o processo
            loginBtn.disabled = true;
            loginBtn.textContent = 'Entrando...';

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Login bem-sucedido, atualiza último login
                    const user = userCredential.user;
                    db.ref('users/' + user.uid + '/lastLogin').set(firebase.database.ServerValue.TIMESTAMP)
                        .then(() => {
                            console.log('Login registrado com sucesso!');
                            window.location.href = 'sigav_hub.html';
                        })
                        .catch((error) => {
                            console.warn('Erro ao registrar último login:', error);
                            // Mesmo com erro no registro do login, redireciona
                            window.location.href = 'sigav_hub.html';
                        });
                })
                .catch((error) => {
                    // Reabilita o botão em caso de erro
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Entrar';
                    
                    // Trata erros de login
                    console.error("Erro de login:", error);
                    switch (error.code) {
                        case 'auth/user-not-found':
                        case 'auth/wrong-password':
                        case 'auth/invalid-credential':
                            loginError.textContent = 'E-mail ou senha inválidos.';
                            break;
                        case 'auth/invalid-email':
                            loginError.textContent = 'Formato de e-mail inválido.';
                            break;
                        case 'auth/too-many-requests':
                            loginError.textContent = 'Muitas tentativas. Tente novamente mais tarde.';
                            break;
                        case 'auth/network-request-failed':
                            loginError.textContent = 'Erro de conexão. Verifique sua internet.';
                            break;
                        default:
                            loginError.textContent = 'Ocorreu um erro ao tentar fazer login.';
                    }
                });
        }

        function handleRegister() {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            loginError.textContent = ''; // Limpa erros

            // Validações de entrada
            if (!name || !email || !password) {
                loginError.textContent = 'Por favor, preencha nome, e-mail e senha.';
                return;
            }
            if (name.length < 2) {
                loginError.textContent = 'O nome deve ter pelo menos 2 caracteres.';
                return;
            }
            if (password.length < 6) {
                loginError.textContent = 'A senha deve ter no mínimo 6 caracteres.';
                return;
            }

            // Desabilita o botão durante o processo
            loginBtn.disabled = true;
            loginBtn.textContent = 'Registrando...';

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Registro bem-sucedido, cria o perfil no banco de dados
                    const user = userCredential.user;
                    const userProfile = {
                        name: name,
                        email: email,
                        uid: user.uid,
                        createdAt: firebase.database.ServerValue.TIMESTAMP,
                        lastLogin: firebase.database.ServerValue.TIMESTAMP
                    };

                    // Salva os dados do usuário no Realtime Database
                    return db.ref('users/' + user.uid).set(userProfile);
                })
                .then(() => {
                    console.log('Usuário registrado e dados salvos no banco com sucesso!');
                    alert('Registro realizado com sucesso! Você será redirecionado.');
                    window.location.href = 'sigav_hub.html';
                })
                .catch((error) => {
                    // Reabilita o botão em caso de erro
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Confirmar Registro';
                    
                    // Trata erros de registro
                    console.error("Erro de registro:", error);
                    switch (error.code) {
                        case 'auth/email-already-in-use':
                            loginError.textContent = 'Este e-mail já está em uso.';
                            break;
                        case 'auth/invalid-email':
                            loginError.textContent = 'Formato de e-mail inválido.';
                            break;
                        case 'auth/weak-password':
                            loginError.textContent = 'A senha é muito fraca.';
                            break;
                        case 'auth/network-request-failed':
                            loginError.textContent = 'Erro de conexão. Verifique sua internet.';
                            break;
                        default:
                            loginError.textContent = 'Ocorreu um erro ao tentar se registrar. Tente novamente.';
                    }
                });
        }

        function toggleRegisterMode(enable) {
            isRegisterMode = enable;
            loginError.textContent = '';
            
            // Reabilita o botão e limpa os campos
            loginBtn.disabled = false;
            nameInput.value = '';
            emailInput.value = '';
            passwordInput.value = '';

            if (enable) {
                // Entra no modo de registro
                nameInput.classList.remove('hidden');
                registerBtn.classList.add('hidden');
                backToLogin.classList.remove('hidden');
                loginBtn.textContent = 'Confirmar Registro';
                nameInput.focus(); // Foca no campo nome
            } else {
                // Volta para o modo de login
                nameInput.classList.add('hidden');
                registerBtn.classList.remove('hidden');
                backToLogin.classList.add('hidden');
                loginBtn.textContent = 'Entrar';
                emailInput.focus(); // Foca no campo email
            }
        }


        // --- Event Listeners ---
        loginBtn.addEventListener('click', () => {
            if (isRegisterMode) {
                handleRegister();
            } else {
                handleLogin();
            }
        });

        registerBtn.addEventListener('click', () => toggleRegisterMode(true));
        backToLogin.addEventListener('click', (e) => {
            e.preventDefault();
            toggleRegisterMode(false);
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (isRegisterMode) {
                    handleRegister();
                } else {
                    handleLogin();
                }
            }
        });
        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (isRegisterMode) {
                    handleRegister();
                } else {
                    handleLogin();
                }
            }
        });
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleRegister();
        });


        // --- Verificação de Estado de Autenticação ---
        auth.onAuthStateChanged(user => {
            const loginForm = document.querySelector('.modal-content');
            if (user) {
                // Se o usuário já está logado, redireciona para o SIGAV Hub
                window.location.href = './sigav_hub.html';
            } else {
                // Se não há usuário, mostra o formulário de login
                if(loginForm) loginForm.classList.remove('hidden');
            }
        });
    </script>

</body>
</html>
