<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../img/svgs/logo-eject.svg">
    <style>
        body {
            font-family: "Inter", sans-serif;
            height: 100vh;
            background: linear-gradient(275.04deg, rgb(228, 243, 255) 1.05%, rgb(244, 246, 251) 100%);
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .modal-content {
            background-color: white;
            padding: 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
            color: #1f2937;
        }
    </style>
</head>
<body class="antialiased">

    <div class="modal-content hidden">
        <img src="../img/logo.svg" alt="Logotipo da EJECT" class="h-12 mx-auto mb-6">
        <h2 class="text-3xl font-bold text-sky-700 mb-4">Acesso às Trilhas</h2>
        <p class="text-gray-600 mb-6">Use seu e-mail e senha para acessar.</p>
        
        <div class="space-y-4">
            <input 
                type="text" 
                id="nameInput" 
                placeholder="Seu nome completo" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500 hidden"
                autocomplete="name"
            >
            <input 
                type="email" 
                id="emailInput" 
                placeholder="Seu e-mail" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500"
                autocomplete="email"
            >
            <input 
                type="password" 
                id="passwordInput" 
                placeholder="Sua senha" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500"
                autocomplete="current-password"
            >
        </div>

        <div class="text-right mt-2">
            <a href="recuperar-senha.html" class="text-sm text-sky-600 hover:underline">Esqueceu a senha?</a>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mt-6">
            <button 
                id="loginBtn" 
                class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-lg shadow transition duration-150 ease-in-out"
            >
                Entrar
            </button>
            <button 
                id="registerBtn" 
                class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 rounded-lg shadow transition duration-150 ease-in-out"
            >
                Registrar
            </button>
        </div>
        <p id="loginError" class="text-red-500 text-sm mt-4 h-4"></p>
        <a href="#" id="backToLogin" class="text-sky-600 hover:underline text-sm mt-4 hidden">Voltar para o login</a>
        
        <div class="mt-6 pt-4 border-t border-gray-200">
            <p class="text-xs text-gray-500">
                Ao usar nossa plataforma, você concorda com nossos 
                <a href="../termos_de_uso.html" target="_blank" class="text-sky-600 hover:text-sky-700 underline">
                    Termos de Uso
                </a>
            </p>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="data-api.js"></script>
    <script>
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const loginError = document.getElementById('loginError');
        const backToLogin = document.getElementById('backToLogin');

        let isRegisterMode = false;

        // --- Funções de Autenticação ---

        function authErrorMessage(error, fallback) {
            switch (error.code) {
                case 'invalid_credentials':
                    return 'E-mail ou senha inválidos.';
                case 'email_not_confirmed':
                    return 'Confirme seu e-mail antes de entrar (verifique sua caixa de entrada).';
                case 'user_already_exists':
                case 'email_exists':
                    return 'Este e-mail já está em uso.';
                case 'validation_failed':
                case 'email_address_invalid':
                    return 'Formato de e-mail inválido.';
                case 'weak_password':
                    return 'A senha é muito fraca.';
                case 'over_request_rate_limit':
                case 'over_email_send_rate_limit':
                    return 'Muitas tentativas. Tente novamente mais tarde.';
                default:
                    if (/fetch|network/i.test(error.message || '')) {
                        return 'Erro de conexão. Verifique sua internet.';
                    }
                    return fallback;
            }
        }

        async function handleLogin() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            loginError.textContent = ''; // Limpa erros

            if (!email || !password) {
                loginError.textContent = 'Por favor, preencha e-mail e senha.';
                return;
            }

            // Desabilita o botão durante o processo
            loginBtn.disabled = true;
            loginBtn.textContent = 'Entrando...';

            try {
                const user = await Api.signIn(email, password);
                // Login bem-sucedido, atualiza último login (falha aqui não impede o acesso)
                await Api.touchLastLogin(user.uid).catch((e) => console.warn('Erro ao registrar último login:', e));
                window.location.href = 'sigav_hub.html';
            } catch (error) {
                // Reabilita o botão em caso de erro
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrar';
                console.error("Erro de login:", error);
                loginError.textContent = authErrorMessage(error, 'Ocorreu um erro ao tentar fazer login.');
            }
        }

        async function handleRegister() {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            loginError.textContent = ''; // Limpa erros

            // Validações de entrada
            if (!name || !email || !password) {
                loginError.textContent = 'Por favor, preencha nome, e-mail e senha.';
                return;
            }
            if (name.length < 2) {
                loginError.textContent = 'O nome deve ter pelo menos 2 caracteres.';
                return;
            }
            if (password.length < 6) {
                loginError.textContent = 'A senha deve ter no mínimo 6 caracteres.';
                return;
            }

            // Desabilita o botão durante o processo
            loginBtn.disabled = true;
            loginBtn.textContent = 'Registrando...';

            try {
                // O perfil (tabela profiles) é criado por trigger no banco a partir do nome informado.
                const result = await Api.signUp(name, email, password);
                if (result.alreadyRegistered) {
                    throw Object.assign(new Error('E-mail já cadastrado'), { code: 'user_already_exists' });
                }
                if (result.needsConfirmation) {
                    alert('Registro realizado! Enviamos um e-mail de confirmação: confirme-o e depois faça login.');
                    loginBtn.disabled = false;
                    toggleRegisterMode(false);
                    return;
                }
                alert('Registro realizado com sucesso! Você será redirecionado.');
                window.location.href = 'sigav_hub.html';
            } catch (error) {
                // Reabilita o botão em caso de erro
                loginBtn.disabled = false;
                loginBtn.textContent = 'Confirmar Registro';
                console.error("Erro de registro:", error);
                loginError.textContent = authErrorMessage(error, 'Ocorreu um erro ao tentar se registrar. Tente novamente.');
            }
        }

        function toggleRegisterMode(enable) {
            isRegisterMode = enable;
            loginError.textContent = '';
            
            // Reabilita o botão e limpa os campos
            loginBtn.disabled = false;
            nameInput.value = '';
            emailInput.value = '';
            passwordInput.value = '';

            if (enable) {
                // Entra no modo de registro
                nameInput.classList.remove('hidden');
                registerBtn.classList.add('hidden');
                backToLogin.classList.remove('hidden');
                loginBtn.textContent = 'Confirmar Registro';
                nameInput.focus(); // Foca no campo nome
            } else {
                // Volta para o modo de login
                nameInput.classList.add('hidden');
                registerBtn.classList.remove('hidden');
                backToLogin.classList.add('hidden');
                loginBtn.textContent = 'Entrar';
                emailInput.focus(); // Foca no campo email
            }
        }


        // --- Event Listeners ---
        loginBtn.addEventListener('click', () => {
            if (isRegisterMode) {
                handleRegister();
            } else {
                handleLogin();
            }
        });

        registerBtn.addEventListener('click', () => toggleRegisterMode(true));
        backToLogin.addEventListener('click', (e) => {
            e.preventDefault();
            toggleRegisterMode(false);
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (isRegisterMode) {
                    handleRegister();
                } else {
                    handleLogin();
                }
            }
        });
        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (isRegisterMode) {
                    handleRegister();
                } else {
                    handleLogin();
                }
            }
        });
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleRegister();
        });


        // --- Verificação de Estado de Autenticação ---
        Api.onAuthChange(user => {
            const loginForm = document.querySelector('.modal-content');
            if (user) {
                // Só redireciona automaticamente fora do fluxo de registro, para o
                // registro terminar (e o aviso ser exibido) antes do redirect.
                if (!isRegisterMode) {
                    window.location.href = './sigav_hub.html';
                }
            } else {
                // Se não há usuário, mostra o formulário de login
                if (loginForm) loginForm.classList.remove('hidden');
            }
        });
    </script>

</body>
</html>
