<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Migração Simples</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Inter", sans-serif;
        }
        .console {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 1rem;
            border-radius: 0.5rem;
            height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center">Migração de Usuários - Realtime Database</h1>
        
        <div class="bg-white p-6 rounded-lg shadow mb-6">
            <h2 class="text-xl font-semibold mb-4">Status</h2>
            <div id="status" class="mb-4">
                <p>🔄 Carregando...</p>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-6 gap-4">
                <button id="testBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    🔍 Testar Conexão
                </button>
                <button id="listBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    👥 Listar Usuários
                </button>
                <button id="migrateBtn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                    🚀 Migrar
                </button>
                <button id="fixEmailBtn" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">
                    📧 Corrigir Emails
                </button>
                <button id="helpBtn" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">
                    ❓ Ajuda Permissões
                </button>
                <button id="clearBtn" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                    🗑️ Limpar Log
                </button>
            </div>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4">Console</h2>
            <div id="console" class="console"></div>
        </div>
    </div>

    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>
    
    <script>
        // Elementos DOM
        const statusDiv = document.getElementById('status');
        const consoleDiv = document.getElementById('console');
        const testBtn = document.getElementById('testBtn');
        const listBtn = document.getElementById('listBtn');
        const migrateBtn = document.getElementById('migrateBtn');
        const fixEmailBtn = document.getElementById('fixEmailBtn');
        const helpBtn = document.getElementById('helpBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Função para log
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: '#0ff',
                success: '#0f0',
                error: '#f00',
                warn: '#ff0'
            };
            
            consoleDiv.innerHTML += `<div style="color: ${colors[type]}">[${timestamp}] ${message}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        // Aguarda Firebase estar pronto
        function waitForFirebase() {
            return new Promise((resolve) => {
                const check = () => {
                    if (typeof firebase !== 'undefined' && 
                        typeof db !== 'undefined' && 
                        typeof auth !== 'undefined') {
                        resolve(true);
                    } else {
                        setTimeout(check, 100);
                    }
                };
                check();
            });
        }

        // Testa conexão e permissões
        async function testarConexao() {
            log('🔍 Testando conexão com Realtime Database...', 'info');
            
            try {
                const snapshot = await db.ref('.info/connected').once('value');
                const connected = snapshot.val();
                
                if (connected) {
                    log('✅ Conectado ao Realtime Database', 'success');
                    
                    // Testa permissões de leitura
                    try {
                        const testRead = await db.ref('users').limitToFirst(1).once('value');
                        log('✅ Permissão de leitura OK', 'success');
                        
                        // Testa permissões de escrita (tentativa segura)
                        try {
                            const testRef = db.ref('test_permission_' + Date.now());
                            await testRef.set({ test: true });
                            await testRef.remove(); // Remove o teste
                            log('✅ Permissão de escrita OK', 'success');
                            statusDiv.innerHTML = '<p class="text-green-600">✅ Conectado com permissões completas</p>';
                        } catch (writeError) {
                            log('❌ Sem permissão de escrita: ' + writeError.message, 'error');
                            statusDiv.innerHTML = '<p class="text-red-600">❌ Conectado mas sem permissão de escrita</p>';
                            log('💡 Solução: Verifique as regras do Firebase ou use uma conta com permissões de admin', 'warn');
                        }
                        
                    } catch (readError) {
                        log('❌ Sem permissão de leitura: ' + readError.message, 'error');
                        statusDiv.innerHTML = '<p class="text-red-600">❌ Conectado mas sem permissões</p>';
                    }
                    
                    return true;
                } else {
                    log('❌ Não conectado ao Realtime Database', 'error');
                    statusDiv.innerHTML = '<p class="text-red-600">❌ Desconectado do Firebase</p>';
                    return false;
                }
            } catch (error) {
                log('❌ Erro: ' + error.message, 'error');
                statusDiv.innerHTML = '<p class="text-red-600">❌ Erro de conexão</p>';
                return false;
            }
        }

        // Lista usuários
        async function listarUsuarios() {
            log('👥 Buscando usuários...', 'info');
            
            try {
                const snapshot = await db.ref('users').once('value');
                const usuarios = snapshot.val();
                
                if (!usuarios) {
                    log('📝 Nenhum usuário encontrado', 'warn');
                    return;
                }
                
                const total = Object.keys(usuarios).length;
                log(`📊 Total de usuários: ${total}`, 'info');
                
                let needMigration = 0;
                let updated = 0;
                let withoutEmail = 0;
                
                Object.entries(usuarios).forEach(([uid, data]) => {
                    const hasNewStructure = data.uid && data.createdAt && data.lastLogin;
                    if (hasNewStructure) {
                        updated++;
                    } else {
                        needMigration++;
                    }
                    
                    if (!data.email) {
                        withoutEmail++;
                    }
                });
                
                log(`✅ Usuários atualizados: ${updated}`, 'success');
                log(`⚠️ Precisam migração: ${needMigration}`, 'warn');
                log(`📧 Sem email: ${withoutEmail}`, withoutEmail > 0 ? 'error' : 'success');
                
            } catch (error) {
                log('❌ Erro ao listar usuários: ' + error.message, 'error');
            }
        }

        // Executa migração adaptada para as regras atuais
        async function executarMigracao() {
            // Verifica se o usuário está autenticado
            const currentUser = auth.currentUser;
            if (!currentUser) {
                log('❌ ERRO: Usuário não autenticado', 'error');
                log('💡 Solução: Faça login primeiro', 'warn');
                alert('Você precisa estar logado para executar a migração!');
                return;
            }
            
            log(`👤 Usuário autenticado: ${currentUser.email}`, 'info');
            
            // Verifica se é o email de admin autorizado
            const isAuthorizedAdmin = currentUser.email === 'educhior@hotmail.com';
            if (!isAuthorizedAdmin) {
                log('❌ ERRO: Usuário não autorizado para migração', 'error');
                log('💡 Apenas educhior@hotmail.com pode executar a migração', 'warn');
                alert('Apenas o administrador autorizado pode executar a migração!');
                return;
            }
            
            log('✅ Usuário autorizado para migração', 'success');
            
            if (!confirm('Executar migração? Esta operação modificará o banco de dados.\n\nEsta operação irá:\n- Adicionar campos faltantes aos usuários existentes\n- Tentar criar backup (pode falhar devido às regras)\n- Processar cada usuário individualmente')) {
                log('❌ Migração cancelada', 'warn');
                return;
            }
            
            log('🚀 Iniciando migração...', 'info');
            
            try {
                // Primeiro testa se consegue ler os usuários
                log('� Testando permissão de leitura...', 'info');
                const snapshot = await db.ref('users').once('value');
                log('✅ Leitura OK', 'success');
                
                // Tentativa de backup (pode falhar devido às regras)
                log('💾 Tentando criar backup...', 'info');
                try {
                    // Tenta criar estrutura de backup primeiro
                    await db.ref('backups').child('test').set({ created: Date.now() });
                    await db.ref('backups').child('test').remove();
                    
                    const backup = {
                        timestamp: new Date().toISOString(),
                        data: snapshot.val(),
                        createdBy: currentUser.email
                    };
                    
                    await db.ref('backups/usuarios_' + Date.now()).set(backup);
                    log('✅ Backup criado com sucesso', 'success');
                } catch (backupError) {
                    log('❌ Não foi possível criar backup: ' + backupError.message, 'warn');
                    log('💡 Continuando migração sem backup (dados originais preservados)', 'info');
                    
                    if (!confirm('Não foi possível criar backup automático devido às regras do Firebase.\n\nDeseja continuar a migração mesmo assim?\n\n(Os dados originais não serão perdidos, apenas novos campos serão adicionados)')) {
                        log('❌ Migração cancelada - backup não disponível', 'warn');
                        return;
                    }
                }
                
                // Migração
                const usuarios = snapshot.val();
                if (!usuarios) {
                    log('❌ Nenhum usuário para migrar', 'warn');
                    return;
                }
                
                let migrated = 0;
                let errors = 0;
                const total = Object.keys(usuarios).length;
                
                log(`📊 Iniciando migração de ${total} usuários...`, 'info');
                
                for (const [uid, data] of Object.entries(usuarios)) {
                    try {
                        log(`🔄 Processando usuário: ${data.email || uid}`, 'info');
                        
                        const updates = {};
                        let needsUpdate = false;
                        
                        // Verifica quais campos precisam ser adicionados
                        if (!data.uid) {
                            updates.uid = uid;
                            needsUpdate = true;
                            log(`  ├─ Adicionando UID`, 'info');
                        }
                        
                        if (!data.email) {
                            // Se não tem email, vamos tentar obter do Firebase Auth ou usar um placeholder
                            log(`  ├─ ⚠️ Usuário sem email - precisará ser corrigido manualmente`, 'warn');
                            updates.email = `user_${uid}@placeholder.com`; // Placeholder que pode ser corrigido depois
                            needsUpdate = true;
                            log(`  ├─ Adicionando email placeholder: ${updates.email}`, 'info');
                        }
                        
                        if (!data.name) {
                            // Como admin, podemos usar a regra especial para o campo name
                            if (data.email) {
                                updates.name = data.email.split('@')[0];
                            } else if (updates.email) {
                                updates.name = updates.email.split('@')[0];
                            } else {
                                updates.name = `Usuário ${uid.substring(0, 8)}`;
                            }
                            needsUpdate = true;
                            log(`  ├─ Adicionando nome: ${updates.name}`, 'info');
                        }
                        
                        if (!data.createdAt) {
                            updates.createdAt = Date.now();
                            needsUpdate = true;
                            log(`  ├─ Adicionando data de criação`, 'info');
                        }
                        
                        if (!data.lastLogin) {
                            updates.lastLogin = Date.now();
                            needsUpdate = true;
                            log(`  ├─ Adicionando último login`, 'info');
                        }
                        
                        if (needsUpdate) {
                            // Tenta atualizar usando permissões de admin
                            try {
                                // Primeiro tenta update direto (pode funcionar como admin)
                                await db.ref(`users/${uid}`).update(updates);
                                migrated++;
                                log(`  └─ ✅ Usuário ${data.email || uid} migrado com sucesso`, 'success');
                            } catch (updateError) {
                                // Se falhar, tenta campo por campo
                                log(`  ├─ Tentativa de update direto falhou, tentando campo por campo...`, 'warn');
                                
                                let fieldUpdated = false;
                                
                                // Atualiza campos que admin pode modificar
                                if (updates.name) {
                                    try {
                                        await db.ref(`users/${uid}/name`).set(updates.name);
                                        fieldUpdated = true;
                                        log(`    ├─ ✅ Nome atualizado`, 'success');
                                    } catch (nameError) {
                                        log(`    ├─ ❌ Erro ao atualizar nome: ${nameError.message}`, 'error');
                                    }
                                }
                                
                                // Tenta outros campos individualmente
                                for (const [field, value] of Object.entries(updates)) {
                                    if (field !== 'name') {
                                        try {
                                            await db.ref(`users/${uid}/${field}`).set(value);
                                            fieldUpdated = true;
                                            log(`    ├─ ✅ ${field} atualizado`, 'success');
                                        } catch (fieldError) {
                                            log(`    ├─ ❌ Erro ao atualizar ${field}: ${fieldError.message}`, 'error');
                                        }
                                    }
                                }
                                
                                if (fieldUpdated) {
                                    migrated++;
                                    log(`  └─ ✅ Usuário ${data.email || uid} parcialmente migrado`, 'success');
                                } else {
                                    errors++;
                                    log(`  └─ ❌ Não foi possível migrar ${data.email || uid}`, 'error');
                                }
                            }
                        } else {
                            log(`  └─ ℹ️ Usuário ${data.email || uid} já possui estrutura completa`, 'info');
                        }
                    } catch (userError) {
                        errors++;
                        log(`❌ Erro geral ao processar usuário ${data.email || uid}: ${userError.message}`, 'error');
                    }
                }
                
                log(`🎉 Migração concluída!`, 'success');
                log(`✅ Migrados: ${migrated}/${total}`, 'success');
                if (errors > 0) {
                    log(`❌ Erros: ${errors}`, 'error');
                }
                
            } catch (error) {
                log('❌ Erro na migração: ' + error.message, 'error');
                
                if (error.code === 'PERMISSION_DENIED') {
                    log('', 'error');
                    log('🔒 ERRO DE PERMISSÃO DETECTADO!', 'error');
                    log('', 'error');
                    log('📋 SOLUÇÕES POSSÍVEIS:', 'warn');
                    log('1. Verifique as regras do Firebase Realtime Database', 'warn');
                    log('2. Certifique-se de estar logado com uma conta de administrador', 'warn');
                    log('3. Verifique se a URL do database está correta', 'warn');
                    log('4. Clique no botão "❓ Ajuda Permissões" para mais informações', 'warn');
                    
                    // Mostra automaticamente as informações de ajuda
                    setTimeout(() => {
                        mostrarInformacoesPermissoes();
                    }, 2000);
                }
            }
        }

        // Event listeners
        testBtn.addEventListener('click', testarConexao);
        listBtn.addEventListener('click', listarUsuarios);
        migrateBtn.addEventListener('click', executarMigracao);
        fixEmailBtn.addEventListener('click', corrigirEmails);
        helpBtn.addEventListener('click', mostrarInformacoesPermissoes);
                clearBtn.addEventListener('click', () => {
            consoleDiv.innerHTML = '';
            log('Console limpo', 'info');
        });

        // Corrige emails faltantes
        async function corrigirEmails() {
            const currentUser = auth.currentUser;
            if (!currentUser || currentUser.email !== 'educhior@hotmail.com') {
                log('❌ ERRO: Apenas educhior@hotmail.com pode executar esta correção', 'error');
                return;
            }

            if (!confirm('Corrigir emails faltantes?\n\nEsta operação irá:\n- Encontrar usuários sem email\n- Tentar obter email do Firebase Auth\n- Adicionar placeholder se necessário')) {
                log('❌ Correção de emails cancelada', 'warn');
                return;
            }

            log('📧 Iniciando correção de emails...', 'info');

            try {
                const snapshot = await db.ref('users').once('value');
                const usuarios = snapshot.val();

                if (!usuarios) {
                    log('❌ Nenhum usuário encontrado', 'warn');
                    return;
                }

                let corrigidos = 0;
                let erros = 0;
                const total = Object.keys(usuarios).length;

                for (const [uid, data] of Object.entries(usuarios)) {
                    try {
                        if (!data.email) {
                            log(`🔄 Corrigindo email para usuário: ${data.name || uid}`, 'info');
                            
                            // Tenta diferentes estratégias para obter o email
                            let emailCorreto = null;
                            
                            // Estratégia 1: Se o nome parece um email
                            if (data.name && data.name.includes('@')) {
                                emailCorreto = data.name;
                                log(`  ├─ Email encontrado no campo nome: ${emailCorreto}`, 'info');
                            }
                            
                            // Estratégia 2: Buscar outros usuarios com mesmo nome
                            if (!emailCorreto) {
                                for (const [otherUid, otherData] of Object.entries(usuarios)) {
                                    if (otherUid !== uid && otherData.name === data.name && otherData.email) {
                                        emailCorreto = otherData.email;
                                        log(`  ├─ Email encontrado em usuário similar: ${emailCorreto}`, 'info');
                                        break;
                                    }
                                }
                            }
                            
                            // Estratégia 3: Placeholder baseado no nome ou UID
                            if (!emailCorreto) {
                                if (data.name && data.name !== 'undefined') {
                                    emailCorreto = `${data.name.toLowerCase().replace(/\s+/g, '.')}@correio-pendente.com`;
                                } else {
                                    emailCorreto = `usuario_${uid.substring(0, 8)}@correio-pendente.com`;
                                }
                                log(`  ├─ Usando email placeholder: ${emailCorreto}`, 'warn');
                            }
                            
                            // Aplica a correção
                            await db.ref(`users/${uid}/email`).set(emailCorreto);
                            corrigidos++;
                            log(`  └─ ✅ Email corrigido para: ${emailCorreto}`, 'success');
                        }
                    } catch (userError) {
                        erros++;
                        log(`❌ Erro ao corrigir email do usuário ${data.name || uid}: ${userError.message}`, 'error');
                    }
                }

                log(`🎉 Correção de emails concluída!`, 'success');
                log(`✅ Emails corrigidos: ${corrigidos}/${total}`, 'success');
                if (erros > 0) {
                    log(`❌ Erros: ${erros}`, 'error');
                }

                if (corrigidos > 0) {
                    log('📝 IMPORTANTE: Alguns emails podem ser placeholders', 'warn');
                    log('Revise e corrija manualmente os emails no Firebase Console', 'warn');
                }

            } catch (error) {
                log('❌ Erro na correção de emails: ' + error.message, 'error');
            }
        }

        // Função para mostrar informações sobre permissões
        function mostrarInformacoesPermissoes() {
            log('📋 INFORMAÇÕES SOBRE PERMISSÕES:', 'info');
            log('', 'info');
            log('🔒 POSSÍVEIS CAUSAS DO ERRO PERMISSION_DENIED:', 'warn');
            log('1. Regras de segurança muito restritivas', 'warn');
            log('2. Usuário não autenticado', 'warn');
            log('3. Usuário sem permissões administrativas', 'warn');
            log('4. URL do database incorreta', 'warn');
            log('', 'info');
            log('🛠️ SOLUÇÕES POSSÍVEIS:', 'info');
            log('1. Verificar se está logado com conta de administrador', 'info');
            log('2. Atualizar regras do Firebase Realtime Database', 'info');
            log('3. Verificar configuração do projeto', 'info');
            log('', 'info');
            log('📝 PARA SUAS REGRAS ATUAIS, ADICIONE TEMPORARIAMENTE:', 'info');
            log('', 'info');
            log('Adicione estas regras no Firebase Console para facilitar a migração:', 'warn');
            log('', 'info');
            log('"backups": {', 'info');
            log('  ".read": "auth.token.email === \'educhior@hotmail.com\'",', 'info');
            log('  ".write": "auth.token.email === \'educhior@hotmail.com\'"', 'info');
            log('},', 'info');
            log('', 'info');
            log('E para cada usuário individual, permita admin escrever todos os campos:', 'info');
            log('', 'info');
            log('"users": {', 'info');
            log('  "$uid": {', 'info');
            log('    ".write": "$uid === auth.uid || auth.token.email === \'educhior@hotmail.com\'"', 'info');
            log('  }', 'info');
            log('}', 'info');
            log('', 'info');
            log('⚠️ REMOVA as regras temporárias após a migração!', 'warn');
        }        // Inicialização
        async function init() {
            log('🔄 Inicializando sistema...', 'info');
            
            try {
                await waitForFirebase();
                log('✅ Firebase carregado', 'success');
                
                // Verifica autenticação
                auth.onAuthStateChanged(user => {
                    if (user) {
                        log(`✅ Autenticado como: ${user.email}`, 'success');
                        statusDiv.innerHTML = `<p class="text-green-600">✅ Autenticado: ${user.email}</p>`;
                        
                        // Testa conexão automaticamente
                        setTimeout(testarConexao, 1000);
                    } else {
                        log('⚠️ Não autenticado', 'warn');
                        statusDiv.innerHTML = '<p class="text-yellow-600">⚠️ Faça login primeiro</p>';
                    }
                });
                
            } catch (error) {
                log('❌ Erro na inicialização: ' + error.message, 'error');
            }
        }

        // Inicia quando a página carrega
        window.addEventListener('load', init);
        log('📋 Sistema carregado', 'info');
    </script>
</body>
</html>
