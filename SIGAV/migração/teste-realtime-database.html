<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Teste Realtime Database</title>
    <!-- Firebase SDKs para Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(275.04deg, rgb(228, 243, 255) 1.05%, rgb(244, 246, 251) 100%);
            color: #1f2937;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .console-log {
            background: #1a1a1a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 1rem;
            border-radius: 0.5rem;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="card p-6 mb-6">
            <div class="flex items-center space-x-4">
                <img src="../img/logo.svg" alt="Logotipo da EJECT" class="h-12">
                <div>
                    <h1 class="text-2xl font-bold text-sky-700">Teste Firebase Realtime Database</h1>
                    <p class="text-gray-600">Verificação de conectividade e estrutura de dados</p>
                </div>
            </div>
        </div>

        <!-- Status -->
        <div class="grid md:grid-cols-2 gap-6 mb-6">
            <div class="card p-6">
                <h3 class="text-lg font-semibold mb-4 text-gray-800">Status da Conexão</h3>
                <div id="connectionStatus" class="flex items-center space-x-2 mb-4">
                    <div class="w-3 h-3 bg-gray-400 rounded-full"></div>
                    <span class="text-gray-600">Verificando...</span>
                </div>
                <div id="dbStatus" class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-gray-400 rounded-full"></div>
                    <span class="text-gray-600">Testando Realtime Database...</span>
                </div>
            </div>
            
            <div class="card p-6">
                <h3 class="text-lg font-semibold mb-4 text-gray-800">Usuários no Database</h3>
                <div id="userStats" class="space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span>Total:</span>
                        <span id="totalUsers" class="font-semibold">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Com estrutura nova:</span>
                        <span id="newStructureUsers" class="font-semibold text-green-600">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Precisam migração:</span>
                        <span id="needMigrationUsers" class="font-semibold text-orange-600">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ações -->
        <div class="card p-6 mb-6">
            <h3 class="text-lg font-semibold mb-4 text-gray-800">Testes Disponíveis</h3>
            
            <div class="grid md:grid-cols-4 gap-4">
                <button id="testConnectionBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg shadow transition-all">
                    🔍 Testar Conexão
                </button>
                
                <button id="listUsersBtn" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-4 rounded-lg shadow transition-all">
                    👥 Listar Usuários
                </button>
                
                <button id="checkStructureBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-3 px-4 rounded-lg shadow transition-all">
                    📋 Verificar Estrutura
                </button>
                
                <button id="runMigrationBtn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-4 rounded-lg shadow transition-all">
                    🚀 Executar Migração
                </button>
            </div>
        </div>

        <!-- Console -->
        <div class="card p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-800">Console</h3>
                <button id="clearLogBtn" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1 rounded transition-colors">
                    Limpar
                </button>
            </div>
            <div id="consoleLog" class="console-log">
                <div style="color: #00ff00;">Sistema iniciando...</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="firebase-config.js"></script>
    <script>
        // Elementos DOM
        const connectionStatus = document.getElementById('connectionStatus');
        const dbStatus = document.getElementById('dbStatus');
        const consoleLog = document.getElementById('consoleLog');
        const totalUsers = document.getElementById('totalUsers');
        const newStructureUsers = document.getElementById('newStructureUsers');
        const needMigrationUsers = document.getElementById('needMigrationUsers');

        // Botões
        const testConnectionBtn = document.getElementById('testConnectionBtn');
        const listUsersBtn = document.getElementById('listUsersBtn');
        const checkStructureBtn = document.getElementById('checkStructureBtn');
        const runMigrationBtn = document.getElementById('runMigrationBtn');
        const clearLogBtn = document.getElementById('clearLogBtn');

        // Função para log no console
        function logToConsole(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                log: '#00ff00',
                error: '#ff4444',
                warn: '#ffaa00',
                info: '#44aaff'
            };
            
            consoleLog.innerHTML += `<div style="color: ${colors[type]};">[${timestamp}] ${message}</div>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        // Testa conexão com Realtime Database
        async function testarConexao() {
            logToConsole('🔍 Testando conexão com Firebase Realtime Database...', 'info');
            
            try {
                // Verifica se está conectado
                const connectedRef = db.ref('.info/connected');
                const snapshot = await connectedRef.once('value');
                const connected = snapshot.val();
                
                if (connected) {
                    logToConsole('✅ Conectado ao Firebase Realtime Database', 'log');
                    dbStatus.innerHTML = `
                        <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                        <span class="text-green-600 font-semibold">Database Online</span>
                    `;
                    return true;
                } else {
                    logToConsole('❌ Não foi possível conectar ao Realtime Database', 'error');
                    dbStatus.innerHTML = `
                        <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                        <span class="text-red-600 font-semibold">Database Offline</span>
                    `;
                    return false;
                }
            } catch (error) {
                logToConsole('❌ Erro ao testar conexão: ' + error.message, 'error');
                dbStatus.innerHTML = `
                    <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                    <span class="text-red-600 font-semibold">Erro de Conexão</span>
                `;
                return false;
            }
        }

        // Lista usuários
        async function listarUsuarios() {
            logToConsole('👥 Buscando usuários...', 'info');
            
            try {
                const snapshot = await db.ref('users').once('value');
                const usuarios = snapshot.val();
                
                if (!usuarios) {
                    logToConsole('📝 Nenhum usuário encontrado no database', 'warn');
                    totalUsers.textContent = '0';
                    newStructureUsers.textContent = '0';
                    needMigrationUsers.textContent = '0';
                    return;
                }
                
                const total = Object.keys(usuarios).length;
                let comEstrutNova = 0;
                let precisaMigracao = 0;
                
                logToConsole(`📊 Total de usuários encontrados: ${total}`, 'log');
                
                // Analisa estrutura de cada usuário
                Object.entries(usuarios).forEach(([uid, userData], index) => {
                    const temEstruturaNova = userData.uid && userData.createdAt && userData.lastLogin;
                    
                    if (temEstruturaNova) {
                        comEstrutNova++;
                    } else {
                        precisaMigracao++;
                    }
                    
                    // Mostra alguns exemplos
                    if (index < 3) {
                        logToConsole(`  └─ ${userData.email || userData.name || uid}: ${temEstruturaNova ? '✅' : '⚠️'}`, 'log');
                    }
                });
                
                if (total > 3) {
                    logToConsole(`  └─ ... e mais ${total - 3} usuários`, 'log');
                }
                
                totalUsers.textContent = total;
                newStructureUsers.textContent = comEstrutNova;
                needMigrationUsers.textContent = precisaMigracao;
                
                logToConsole(`📋 Resumo: ${comEstrutNova} atualizados, ${precisaMigracao} precisam migração`, 'info');
                
            } catch (error) {
                logToConsole('❌ Erro ao listar usuários: ' + error.message, 'error');
            }
        }

        // Verifica estrutura detalhada
        async function verificarEstrutura() {
            logToConsole('📋 Verificando estrutura detalhada...', 'info');
            
            try {
                const snapshot = await db.ref('users').limitToFirst(5).once('value');
                const usuarios = snapshot.val();
                
                if (!usuarios) {
                    logToConsole('❌ Nenhum usuário para analisar', 'warn');
                    return;
                }
                
                logToConsole('🔍 Análise dos primeiros 5 usuários:', 'info');
                
                Object.entries(usuarios).forEach(([uid, userData]) => {
                    logToConsole(`\n👤 Usuário: ${userData.email || userData.name || uid}`, 'info');
                    logToConsole(`   ├─ UID: ${userData.uid ? '✅' : '❌'}`, userData.uid ? 'log' : 'warn');
                    logToConsole(`   ├─ Email: ${userData.email ? '✅' : '❌'}`, userData.email ? 'log' : 'warn');
                    logToConsole(`   ├─ Nome: ${userData.name ? '✅' : '❌'}`, userData.name ? 'log' : 'warn');
                    logToConsole(`   ├─ Data Criação: ${userData.createdAt ? '✅' : '❌'}`, userData.createdAt ? 'log' : 'warn');
                    logToConsole(`   └─ Último Login: ${userData.lastLogin ? '✅' : '❌'}`, userData.lastLogin ? 'log' : 'warn');
                });
                
            } catch (error) {
                logToConsole('❌ Erro ao verificar estrutura: ' + error.message, 'error');
            }
        }

        // Executa migração
        async function executarMigracao() {
            const confirmacao = confirm(
                'Esta operação irá atualizar a estrutura dos dados dos usuários.\n\n' +
                'ATENÇÃO:\n' +
                '- Esta operação modifica o banco de dados\n' +
                '- Um backup será criado automaticamente\n' +
                '- Certifique-se de ter permissões de administrador\n\n' +
                'Deseja continuar?'
            );
            
            if (!confirmacao) {
                logToConsole('❌ Migração cancelada pelo usuário', 'warn');
                return;
            }
            
            logToConsole('🚀 Iniciando processo de migração...', 'info');
            
            try {
                // Criar backup primeiro
                logToConsole('💾 Criando backup...', 'info');
                const snapshot = await db.ref('users').once('value');
                const backup = {
                    timestamp: new Date().toISOString(),
                    data: snapshot.val()
                };
                
                await db.ref('backups/usuarios_' + Date.now()).set(backup);
                logToConsole('✅ Backup criado com sucesso', 'log');
                
                // Executar migração
                const usuarios = snapshot.val();
                if (!usuarios) {
                    logToConsole('❌ Nenhum usuário para migrar', 'warn');
                    return;
                }
                
                let atualizados = 0;
                const total = Object.keys(usuarios).length;
                
                for (const [uid, userData] of Object.entries(usuarios)) {
                    const updates = {};
                    let needsUpdate = false;
                    
                    // Adiciona campos faltantes
                    if (!userData.uid) {
                        updates.uid = uid;
                        needsUpdate = true;
                    }
                    
                    if (!userData.name && userData.email) {
                        updates.name = userData.email.split('@')[0];
                        needsUpdate = true;
                    }
                    
                    if (!userData.createdAt) {
                        updates.createdAt = Date.now();
                        needsUpdate = true;
                    }
                    
                    if (!userData.lastLogin) {
                        updates.lastLogin = Date.now();
                        needsUpdate = true;
                    }
                    
                    if (needsUpdate) {
                        await db.ref(`users/${uid}`).update(updates);
                        atualizados++;
                        logToConsole(`✅ Usuário ${userData.email || uid} atualizado`, 'log');
                    }
                }
                
                logToConsole(`🎉 Migração concluída! ${atualizados}/${total} usuários atualizados`, 'log');
                
                // Atualiza estatísticas
                await listarUsuarios();
                
            } catch (error) {
                logToConsole('❌ Erro durante migração: ' + error.message, 'error');
            }
        }

        // Event listeners
        testConnectionBtn.addEventListener('click', testarConexao);
        listUsersBtn.addEventListener('click', listarUsuarios);
        checkStructureBtn.addEventListener('click', verificarEstrutura);
        runMigrationBtn.addEventListener('click', executarMigracao);
        clearLogBtn.addEventListener('click', () => {
            consoleLog.innerHTML = '<div style="color: #00ff00;">Console limpo...</div>';
        });

        // Inicialização
        auth.onAuthStateChanged(user => {
            if (user) {
                connectionStatus.innerHTML = `
                    <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                    <span class="text-green-600 font-semibold">Autenticado: ${user.email}</span>
                `;
                logToConsole(`✅ Usuário autenticado: ${user.email}`, 'log');
                
                // Testa conexão automaticamente
                setTimeout(testarConexao, 1000);
            } else {
                connectionStatus.innerHTML = `
                    <div class="w-3 h-3 bg-red-500 rounded-full"></div>
                    <span class="text-red-600 font-semibold">Não autenticado</span>
                `;
                logToConsole('⚠️ Usuário não autenticado. Faça login primeiro.', 'warn');
            }
        });

        logToConsole('🎛️ Interface de teste carregada!', 'info');
    </script>
</body>
</html>
