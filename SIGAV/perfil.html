<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Meu Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../img/svgs/logo-eject.svg">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(275.04deg, rgb(228, 243, 255) 1.05%, rgb(244, 246, 251) 100%);
            color: #1f2937;
        }
    </style>
</head>

<body class="antialiased">

    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-sky-700">
                        Meu Perfil
                    </span>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <a href="./sigav_hub.html" title="Voltar ao Hub SIGAV"
                        class="p-2 rounded-full text-sky-600 hover:bg-sky-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition-colors">
                        <i data-lucide="home" class="h-6 w-6"></i>
                    </a>
                    <a href="https://www.ejectufrn.com.br/" target="_blank" rel="noopener noreferrer">
                        <img src="../img/logo.svg" alt="Logotipo da EJECT" class="h-10">
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <h1 class="text-4xl font-extrabold text-sky-800 mb-8 flex items-center">
            <i data-lucide="user-cog" class="h-8 w-8 mr-3"></i>
            Editar Perfil
        </h1>

        <section class="p-6 bg-white rounded-xl shadow-lg mb-8 border border-sky-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <i data-lucide="award" class="h-6 w-6 text-yellow-500"></i>
                Minhas Conquistas
            </h2>

            <div id="badgesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-6 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                    <p class="text-gray-500 text-sm italic">Você ainda não possui insígnias.</p>
                    <p class="text-xs text-gray-400 mt-1">Complete missões para desbloquear!</p>
                </div>
            </div>
        </section>

        <section class="p-6 bg-white rounded-xl shadow-lg mb-8">
            <div class="space-y-4">
                <div>
                    <label for="userNameInput" class="block text-sm font-medium text-gray-700">Seu nome</label>
                    <input type="text" id="userNameInput" placeholder="Digite seu nome ou apelido"
                        class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500">
                </div>
                <button id="saveNameBtn"
                    class="w-full flex items-center justify-center bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 px-6 rounded-lg shadow transition duration-150 ease-in-out">
                    <i data-lucide="save" class="h-5 w-5 mr-2"></i>
                    Salvar Nome
                </button>
                <p id="saveNameMessage" class="text-sm text-green-600 text-center pt-2"></p>
            </div>
        </section>

        <section class="p-6 bg-red-50 border-l-4 border-red-500 rounded-r-lg shadow-lg mt-8">
            <h2 class="text-2xl font-bold text-red-800 mb-4">Área de Risco</h2>
            <p class="text-sm text-red-700 mb-4">A exclusão da sua conta é permanente. Digite sua senha para confirmar.
            </p>
            <div>
                <label for="deletePasswordInput" class="block text-sm font-medium text-red-700">Sua senha atual</label>
                <input type="password" id="deletePasswordInput" placeholder="Senha"
                    class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500">
            </div>
            <button id="deleteAccountBtn"
                class="mt-4 w-full flex items-center justify-center bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg shadow transition duration-150 ease-in-out">
                <i data-lucide="trash-2" class="h-5 w-5 mr-2"></i>
                Deletar Conta
            </button>
            <p id="deleteAccountMessage" class="text-sm text-center pt-2"></p>
        </section>
    </main>

    <script src="./firebase-config.js"></script>

    <script>
        const DASHBOARD_URL = 'index.html';

        // --- LÓGICA DE INSÍGNIAS ---
        function loadUserBadges(user) {
            const badgesGrid = document.getElementById('badgesGrid');

            // Ouve mudanças no nó 'badges' do usuário
            db.ref(`users/${user.uid}/badges`).on('value', snapshot => {
                const badges = snapshot.val();

                // Limpa o grid
                badgesGrid.innerHTML = '';

                if (badges) {
                    // Transforma objeto em array e itera
                    Object.values(badges).forEach(badge => {
                        const badgeEl = document.createElement('div');
                        badgeEl.className = 'flex flex-col items-center p-4 bg-white rounded-lg border border-sky-100 shadow-sm hover:shadow-md transition-all group';

                        // Formata a data (se existir)
                        const dateStr = badge.date ? new Date(badge.date).toLocaleDateString('pt-BR') : '';

                        badgeEl.innerHTML = `
                            <div class="w-20 h-20 mb-3 relative flex items-center justify-center">
                                <div class="absolute inset-0 bg-sky-100 rounded-full opacity-0 group-hover:opacity-50 transition-opacity blur-lg"></div>
                                <img src="${badge.image}" alt="${badge.name}" class="w-full h-full object-contain drop-shadow-sm group-hover:scale-110 transition-transform duration-300">
                            </div>
                            <span class="text-xs font-bold text-sky-800 text-center uppercase tracking-wide">${badge.name}</span>
                            ${dateStr ? `<span class="text-[10px] text-gray-400 mt-1 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${dateStr}</span>` : ''}
                        `;
                        badgesGrid.appendChild(badgeEl);
                    });
                    // Atualiza ícones do Lucide dentro dos novos elementos
                    lucide.createIcons();
                } else {
                    // Mostra mensagem vazia se não tiver badges
                    badgesGrid.innerHTML = `
                        <div class="col-span-full text-center py-6 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                            <p class="text-gray-500 text-sm italic">Você ainda não possui insígnias.</p>
                            <p class="text-xs text-gray-400 mt-1">Complete missões para desbloquear!</p>
                        </div>
                    `;
                }
            });
        }
        // ---------------------------

        function loadUserName(user) {
            const userId = user.uid;
            db.ref(`users/${userId}/name`).once('value').then(snapshot => {
                if (snapshot.val()) document.getElementById('userNameInput').value = snapshot.val();
            });
        }

        // ... (Manter suas funções existentes de salvarNome, senha, email, etc aqui) ...

        function initProfilePage() {
            lucide.createIcons();
            auth.onAuthStateChanged(user => {
                if (user) {
                    loadUserName(user);
                    loadUserBadges(user); // Carrega as insígnias

                    // Listeners existentes
                    document.getElementById('saveNameBtn').addEventListener('click', saveUserName);
                    // ... outros listeners
                    document.getElementById('deleteAccountBtn').addEventListener('click', deleteAccount);
                } else {
                    window.location.href = DASHBOARD_URL;
                }
            });
        }

        // Funções placeholder para o exemplo funcionar (substitua pelas suas originais completas)
        function saveUserName() { /* Lógica original */ }
        function deleteAccount() { /* Lógica original */ }

        window.addEventListener('DOMContentLoaded', initProfilePage);
    </script>
</body>

</html>
