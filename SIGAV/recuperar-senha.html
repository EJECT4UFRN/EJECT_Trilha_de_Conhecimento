<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Recuperar Senha</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="data-api.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../img/svgs/logo-eject.svg">
    <style>
        body {
            font-family: "Inter", sans-serif;
            height: 100vh;
            background: linear-gradient(275.04deg, rgb(228, 243, 255) 1.05%, rgb(244, 246, 251) 100%);
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .modal-content {
            background-color: white;
            padding: 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
            color: #1f2937;
        }
    </style>
</head>
<body class="antialiased">

    <div class="modal-content">
        <img src="../img/logo.svg" alt="Logotipo da EJECT" class="h-12 mx-auto mb-6">
        <h2 class="text-3xl font-bold text-sky-700 mb-4">Recuperar Senha</h2>
        <p class="text-gray-600 mb-6">Insira seu e-mail para receber o link de redefinição de senha.</p>
        
        <form id="recuperar-senha-form">
            <div class="space-y-4">
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Seu e-mail" 
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="flex flex-col sm:flex-row gap-3 mt-6">
                <button 
                    type="submit"
                    class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-lg shadow transition duration-150 ease-in-out"
                >
                    Enviar Link
                </button>
            </div>
             <div id="mensagem" class="mt-4 text-center h-5"></div>
        </form>
        <a href="login.html" class="text-sky-600 hover:underline text-sm mt-4 inline-block">Voltar para o login</a>
        
        <div class="mt-6 pt-4 border-t border-gray-200">
            <p class="text-xs text-gray-500">
                <a href="../termos_de_uso.html" target="_blank" class="text-sky-600 hover:text-sky-700 underline">
                    Termos de Uso
                </a>
            </p>
        </div>
    </div>

    <!-- Supabase -->
    <script>
        const form = document.getElementById('recuperar-senha-form');
        const emailInput = document.getElementById('email');
        const mensagemDiv = document.getElementById('mensagem');
        const submitButton = form.querySelector('button[type="submit"]');
        const titulo = document.querySelector('h2');
        const descricao = titulo.nextElementSibling;

        let modoNovaSenha = false;

        function entrarModoNovaSenha() {
            if (modoNovaSenha) return;
            modoNovaSenha = true;
            titulo.textContent = 'Nova Senha';
            descricao.textContent = 'Digite a nova senha para a sua conta.';
            emailInput.type = 'password';
            emailInput.placeholder = 'Nova senha (mín. 6 caracteres)';
            emailInput.autocomplete = 'new-password';
            emailInput.minLength = 6;
            emailInput.value = '';
            submitButton.textContent = 'Salvar nova senha';
            mensagemDiv.innerHTML = '';
        }

        // O link do e-mail abre esta página com um token de recuperação. Dependendo do fluxo do
        // projeto ele chega como #...type=recovery (implícito) ou ?code=... (PKCE), então detectamos
        // pela URL e também pelo evento PASSWORD_RECOVERY.
        const urlParams = new URLSearchParams(window.location.hash.slice(1) || window.location.search);
        if (urlParams.get('type') === 'recovery' || urlParams.has('code')) {
            entrarModoNovaSenha();
        }
        Api.onAuthChange((user, event) => {
            if (event === 'PASSWORD_RECOVERY') entrarModoNovaSenha();
        });

        function mostrar(tipo, texto) {
            const cor = tipo === 'ok' ? 'text-green-500' : 'text-red-500';
            mensagemDiv.innerHTML = `<p class="${cor}"></p>`;
            mensagemDiv.firstChild.textContent = texto;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const valor = emailInput.value;

            // Desabilitar botão e mostrar feedback
            submitButton.disabled = true;
            submitButton.textContent = 'Enviando...';
            mensagemDiv.innerHTML = '';

            try {
                if (modoNovaSenha) {
                    if (!(await Api.currentUser())) {
                        throw Object.assign(new Error('sem sessão'), { code: 'no_session' });
                    }
                    await Api.updatePassword(valor);
                    mostrar('ok', 'Senha alterada! Redirecionando para o login...');
                    await Api.signOut();
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                    return;
                }
                const destino = window.location.origin + window.location.pathname;
                await Api.resetPassword(valor, destino);
                // Mantém o botão desabilitado para evitar reenvios.
                // (Por segurança o Supabase não revela se o e-mail existe.)
                mostrar('ok', 'Se o e-mail estiver cadastrado, enviamos o link de redefinição. Verifique sua caixa de entrada.');
            } catch (error) {
                console.error('Erro na recuperação de senha:', error);
                let mensagemErro = 'Ocorreu um erro. Tente novamente.';
                if (error.code === 'weak_password') mensagemErro = 'A senha é muito fraca (mínimo 6 caracteres).';
                if (error.code === 'no_session') mensagemErro = 'Link inválido ou expirado. Solicite um novo link de redefinição.';
                if (error.code === 'same_password') mensagemErro = 'A nova senha deve ser diferente da atual.';
                if (error.code === 'over_email_send_rate_limit' || error.code === 'over_request_rate_limit') {
                    mensagemErro = 'Muitas tentativas. Aguarde um pouco e tente novamente.';
                }
                mostrar('erro', mensagemErro);
                submitButton.disabled = false;
                submitButton.textContent = modoNovaSenha ? 'Salvar nova senha' : 'Enviar Link';
            }
        });
    </script>
</body>
</html>
