<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJECT | Dashboard</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../img/svgs/logo-eject.svg">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(275.04deg, rgb(228, 243, 255) 1.05%, rgb(244, 246, 251) 100%);
            color: #1f2937;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        .dashboard-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.2); /* sky-600 shadow */
        }
    </style>
</head>
<body class="antialiased">

    <!-- Dashboard Principal -->
    <div id="dashboardContent" class="hidden">
        <header class="bg-white shadow-md sticky top-0 z-50">
            <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-20">
                    <div class="flex items-center">
                        <span class="text-2xl font-bold text-sky-700">
                            <span id="welcomeMessage">Dashboard</span>
                        </span>
                    </div>
                    <div class="flex items-center space-x-2 sm:space-x-4">
                        <!-- Botão de Logout -->
                         <button id="logoutBtn" title="Sair / Trocar Usuário" class="p-2 rounded-full text-red-600 hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors">
                            <i data-lucide="log-out" class="h-6 w-6"></i>
                        </button>
                        <!-- Logotipo da EJECT -->
                        <a href="https://www.ejectufrn.com.br/" target="_blank" rel="noopener noreferrer">
                            <img src="../img/logo.svg" alt="Logotipo da EJECT" class="h-10">
                        </a>
                    </div>
                </div>
            </nav>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <h1 class="text-4xl font-extrabold text-sky-800 mb-8">Suas Trilhas de Conhecimento</h1>

            <!-- Seção de Trilhas (Cartões) -->
            <div id="trailsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Cards de trilhas iniciadas serão inseridos aqui dinamicamente -->
            </div>
            <div id="noTrailsMessage" class="hidden text-center py-12 bg-white rounded-xl shadow-md">
                <i data-lucide="rocket" class="h-16 w-16 mx-auto text-sky-500"></i>
                <h2 class="mt-4 text-2xl font-bold text-gray-700">Nenhuma trilha iniciada ainda!</h2>
                <p class="text-gray-500 mt-2">Parece que sua jornada de conhecimento está prestes a começar.</p>
                <a href="../index.html" class="mt-6 inline-block bg-sky-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-sky-700 transition-transform transform hover:scale-105">
                    Ver todas as trilhas
                </a>
            </div>
        </main>
    </div>

    <footer class="bg-sky-900 text-white text-center py-6 mt-12">
        <p class="text-sm">Feito com <strong class="font-semibold">foco</strong> e <strong class="font-semibold">compromisso</strong> pela EJECT© - Todos os direitos reservados.</p>
    </footer>


    <!-- Firebase Config e Lógica de Autenticação -->
    <script src="firebase-config.js"></script>
    <script>
        // --- Inicialização do Realtime Database ---
        const db = firebase.database();

        // --- Estrutura de Dados de Todas as Trilhas ---
        const ALL_TRAILS = [
            { id: 'html_e_css', title: 'HTML 5 e CSS 3', description: 'Fundamentos do desenvolvimento web, da semântica à responsividade.', link: '../Trilhas/html_e_css.html', totalTopics: 12 },
            { id: 'javaScript', title: 'JavaScript Essencial', description: 'Lógica, manipulação do DOM e os primeiros passos na interatividade.', link: '../Trilhas/javaScript.html', totalTopics: 5 },
            { id: 'git_e_github', title: 'Git e GitHub', description: 'Controle de versão para organizar e colaborar em seus projetos.', link: '../Trilhas/git_e_github.html', totalTopics: 8 },
            { id: 'python_basico', title: 'Python Básico', description: 'Introdução à uma das linguagens mais versáteis e populares do mercado.', link: '../Trilhas/python_basico.html', totalTopics: 11 },
            { id: 'django', title: 'Django Framework', description: 'Crie aplicações web robustas e escaláveis com o poder do Python.', link: '../Trilhas/django.html', totalTopics: 9 },
            { id: 'vue', title: 'Vue.js', description: 'Desenvolva interfaces reativas e modernas com este framework progressivo.', link: '../Trilhas/vue.html', totalTopics: 10 },
            { id: 'typescript', title: 'TypeScript', description: 'Adicione superpoderes ao seu JavaScript com tipagem estática.', link: '../Trilhas/typescript.html', totalTopics: 7 },
            { id: 'ux_ui', title: 'UX/UI Design', description: 'Conceitos de experiência do usuário e design de interfaces.', link: '../Trilhas/ux_ui.html', totalTopics: 8 },
            { id: 'Scrum', title: 'Metodologia Scrum', description: 'Aprenda o framework ágil mais usado para gestão de projetos.', link: '../Trilhas/Scrum.html', totalTopics: 6 },
            { id: 'Metodologia_5S', title: 'Metodologia 5S', description: 'Organização e disciplina para um ambiente de trabalho mais eficiente.', link: '../Trilhas/Metodologia_5S.html', totalTopics: 5 },
            { id: 'gestao_de_tempo', title: 'Gestão de Tempo', description: 'Técnicas para aumentar sua produtividade e organização pessoal.', link: '../Trilhas/gestao_de_tempo.html', totalTopics: 7 },
            { id: 'desenvolvimento_humano', title: 'Desenvolvimento Humano', description: 'Habilidades interpessoais e crescimento pessoal para sua carreira.', link: '../Trilhas/desenvolvimento_humano.html', totalTopics: 8 },
            { id: 'financeiro', title: 'Financeiro', description: 'Princípios de gestão financeira para projetos e para a vida.', link: '../Trilhas/financeiro.html', totalTopics: 9 },
            { id: 'marketing_comercial', title: 'Marketing e Comercial', description: 'Estratégias para promover e vender produtos e serviços.', link: '../Trilhas/marketing_comercial.html', totalTopics: 10 },
            { id: 'okrs_kpis_e_bpmn', title: 'OKRs, KPIs e BPMN', description: 'Métricas e modelagem de processos para gestão de performance.', link: '../Trilhas/okrs_kpis_e_bpmn.html', totalTopics: 7 },
            { id: 'wordpress', title: 'WordPress', description: 'Crie sites e blogs poderosos sem precisar de código.', link: '../Trilhas/wordpress.html', totalTopics: 8 },
            { id: 'historia_eject', title: 'História da EJECT', description: 'Conheça a trajetória e os valores da nossa empresa.', link: '../Trilhas/historia_eject.html', totalTopics: 4 },
        ];

        // --- Funções de Lógica do Progresso ---

        function calculateProgress(progressData, totalTopics) {
            if (!progressData || typeof progressData !== 'object' || totalTopics === 0) {
                return { completed: 0, percentage: 0 };
            }
            const completedCount = Object.values(progressData).filter(status => status === true).length;
            const percentage = Math.round((completedCount / totalTopics) * 100);
            return { completed: completedCount, percentage };
        }

        function createTrailCard(trail, percentage) {
            const isCompleted = percentage === 100;
            const borderColor = isCompleted ? 'border-green-500' : 'border-sky-500';
            const textColor = isCompleted ? 'text-green-700' : 'text-sky-700';
            const bgColor = isCompleted ? 'bg-green-600' : 'bg-sky-600';
            const icon = isCompleted ? 'check-circle-2' : 'arrow-right';

            return `
                <a href="${trail.link}" class="dashboard-card block bg-white rounded-xl p-6 shadow-lg card-shadow border-t-4 ${borderColor} transition transform duration-300">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold ${textColor}">${trail.title}</h2>
                        <i data-lucide="${icon}" class="h-6 w-6 ${textColor.replace('700', '500')}"></i>
                    </div>
                    <p class="text-gray-600 mb-4 text-sm">${trail.description}</p>
                    
                    <div class="mt-4">
                        <h3 class="text-sm font-semibold ${textColor} mb-1">Seu Progresso:</h3>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div class="h-2.5 rounded-full ${bgColor} transition-all duration-500 ease-in-out" style="width: ${percentage}%"></div>
                        </div>
                        <p class="text-xs font-medium mt-1 text-gray-500 text-right">${percentage}%</p>
                    </div>
                </a>
            `;
        }

        async function loadStartedTrails(userId) {
            const container = document.getElementById('trailsContainer');
            const noTrailsMessage = document.getElementById('noTrailsMessage');
            const welcomeMessage = document.getElementById('welcomeMessage');
            
            container.innerHTML = '<p class="text-gray-500 col-span-full text-center">Carregando seu progresso...</p>';

            try {
                const progressRef = db.ref(`users/${userId}/progress`);
                const snapshot = await progressRef.once('value');
                const allProgress = snapshot.val();

                container.innerHTML = ''; // Limpa o estado de carregamento

                if (!allProgress || Object.keys(allProgress).length === 0) {
                    noTrailsMessage.classList.remove('hidden');
                    return;
                }

                const trailIds = Object.keys(allProgress);
                let startedTrailsCount = 0;

                trailIds.forEach(trailId => {
                    const progressData = allProgress[trailId];
                    const trail = ALL_TRAILS.find(t => t.id === trailId);

                    if (trail && progressData) {
                        startedTrailsCount++;
                        const { percentage } = calculateProgress(progressData, trail.totalTopics);
                        const cardHTML = createTrailCard(trail, percentage);
                        container.insertAdjacentHTML('beforeend', cardHTML);
                    }
                });

                if (startedTrailsCount === 0) {
                    noTrailsMessage.classList.remove('hidden');
                } else {
                    noTrailsMessage.classList.add('hidden');
                }

            } catch (error) {
                console.error("Erro ao carregar progresso do Realtime Database:", error);
                container.innerHTML = '<p class="text-red-500 col-span-full text-center">Não foi possível carregar seu progresso. Tente recarregar a página.</p>';
            } finally {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }
        }
        
        // --- Funções de Autenticação e Inicialização ---

        function showDashboard(user) {
            document.getElementById('dashboardContent').classList.remove('hidden');
            const displayName = user.email.split('@')[0] || 'Membro';
            document.getElementById('welcomeMessage').textContent = `Olá, ${displayName}!`;
            
            loadStartedTrails(user.uid);
        }

        function handleLogout() {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            }).catch((error) => {
                console.error("Erro ao fazer logout:", error);
                alert("Ocorreu um erro ao tentar sair. Tente novamente.");
            });
        }

        // --- Verificação de Estado de Autenticação ---
        auth.onAuthStateChanged(user => {
            if (user) {
                showDashboard(user);
                document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            } else {
                window.location.href = 'login.html';
            }
        });

    </script>
</body>
</html>
